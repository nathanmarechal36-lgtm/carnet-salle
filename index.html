function demo(ex){const A=ANIM[ex.id];if(!A)return '';const ks=A.k,n=ks.length,d=A.d||2.6;
  const kt=Array.from({length:n+1},(_,i)=>+(i/n).toFixed(3)).join(';'),sp=Array(n).fill('.45 0 .55 1').join(';');
  const an=(at,j,i)=>`<animate attributeName="${at}" values="${ks.map(P=>P[j][i]).concat(ks[0][j][i]).join(';')}" keyTimes="${kt}" calcMode="spline" keySplines="${sp}" dur="${d}s" repeatCount="indefinite"/>`;
  const col=g=>SEGM[g].some(m=>ex.mp.includes(m))?'var(--acc)':SEGM[g].some(m=>ex.ms.includes(m))?'#86a352':'#c9cfc2';
  const ln=(a,b,g,far)=>ks[0][a]&&ks[0][b]?`<line x1="${ks[0][a][0]}" y1="${ks[0][a][1]}" x2="${ks[0][b][0]}" y2="${ks[0][b][1]}" stroke="${col(g)}" stroke-width="${g==='t'?8:g==='ft'?4:6}" stroke-linecap="round"${far?' opacity=".4"':''}>${an('x1',a,0)}${an('y1',a,1)}${an('x2',b,0)}${an('y2',b,1)}</line>`:'';
  const dot=(j,r,fill,extra)=>`<circle cx="${ks[0][j][0]}" cy="${ks[0][j][1]}" r="${r}" fill="${fill}" ${extra||''}>${an('cx',j,0)}${an('cy',j,1)}</circle>`;
  let back='',front='';(A.eq||[]).forEach(q=>{
    if(q[0]==='rect')back+=`<rect x="${q[1]}" y="${q[2]}" width="${q[3]}" height="${q[4]}" rx="2" fill="#2a3025" stroke="#3d4535"/>`;
    else if(q[0]==='line')back+=`<line x1="${q[1]}" y1="${q[2]}" x2="${q[3]}" y2="${q[4]}" stroke="#8d9586" stroke-width="4" stroke-linecap="round"/>`;
    else if(q[0]==='circle')back+=`<circle cx="${q[1]}" cy="${q[2]}" r="${q[3]}" fill="#3d4535"/>`;
    else if(q[0]==='cable')back+=`<line x1="${q[1]}" y1="${q[2]}" x2="${ks[0][q[3]][0]}" y2="${ks[0][q[3]][1]}" stroke="#5d6555" stroke-width="1.5">${an('x2',q[3],0)}${an('y2',q[3],1)}</line>`;
    else if(q[0]==='plate')back+=dot(q[1],12,'#3a4232','stroke="#8d9586" stroke-width="2"');
    else if(q[0]==='db')front+=dot(q[1],5.5,'#8d9586');
    else if(q[0]==='ball')front+=dot(q[1],9,'var(--ora)')});
  const body=ln('p','k2','th',1)+ln('k2','a2','sh',1)+ln('a2','f2','ft',1)+back+ln('s','p','t')+ln('p','k','th')+ln('k','a','sh')+ln('a','f','ft')+ln('s','e','ua')+ln('e','w','fa')+dot('h',9,'#c9cfc2');
  return `<div class="demo"><svg viewBox="0 -30 200 184" role="img" aria-label="Démo animée : ${esc(ex.name)}"><line x1="0" y1="150.5" x2="200" y2="150.5" stroke="#3d4535" stroke-width="2"/>${body}${front}</svg>${A.tip?`<div class="small" style="text-align:center;color:#cfd5c9;margin-top:6px">${esc(A.tip)}</div>`:''}</div>`}

  const goalT=(+profile.goalGym||0)+(+profile.goalVb||0)||1,ents=Object.values(logs).filter(e=>inR(e.date)&&EX[e.exId]);
  const sets=ents.reduce((a,e)=>a+e.sets.filter(s=>s.d&&isDone(s)).length,0),kg=ents.reduce((a,e)=>a+volOf(e),0),jc=plyoContacts(lw,le);
  const recs=recordEvents().filter(r=>inR(r.d)),ws=wSorted(),wl=ws.filter(x=>inR(x.date)).pop(),wb=ws.filter(x=>x.date<lw).pop(),G=gameStats();

  const un=(a,b)=>{const ids=new Set(a.map(x=>x.id));(b||[]).forEach(x=>{if(x&&x.id&&!ids.has(x.id))a.push(x)});return a},mo=(a,b)=>Object.assign({},b||{},a);
  volley=un(volley,o.volley);jumps=un(jumps,o.jumps);weights=un(weights,o.weights);swaps=mo(swaps,o.swaps);rpe=mo(rpe,o.rpe);ready=mo(ready,o.ready);prot=mo(prot,o.prot);custom=mo(custom,o.custom);
  profile=Object.assign({},DEF_PROFILE,profile,o.profile||{},{onb:1});if(!match&&o.match)match=o.match;saveAll();cMuted=false;gC=null;sync.dirty=true}

    if(!r){if(!profile.name&&u.displayName){profile.name=u.displayName;saveProfile()}await pushCloud()}
    else if(!hasLocal()){applyRemote(r.o);sync={uid:u.uid,stamp:r.stamp,dirty:false,n:r.n};LS.set('gym_sync',sync);cState='ok';cLast=Date.now();render();toast('Ta progression est récupérée ✓',2600)}
    else{mergeData(r.o);sync.n=r.n;await pushCloud();render();toast('Données du téléphone et du compte réunies ✓',2800)}}
  catch(e){console.warn(e);cState=navigator.onLine?'err':'offline';toast(fbErr(e),3500)}refreshAcct()}

    if(!r){await pushCloud()}
    else if(r.stamp>(sync.stamp||0)){if(sync.dirty){mergeData(r.o);sync.n=r.n;await pushCloud()}else{applyRemote(r.o);sync={uid:u.uid,stamp:r.stamp,dirty:false,n:r.n};LS.set('gym_sync',sync);cState='ok';cLast=Date.now()}if(!typing()&&$('#sheet').hidden)render()}

// Envoie les données (découpées en morceaux) + le résumé visible par l’équipe
async function pushCloud(){if(!cUser||!fbDb)return;if(cBusy){clearTimeout(cT);cT=setTimeout(pushCloud,3000);return}if(navigator.onLine===false){cState='offline';refreshAcct();return}
  cBusy=true;cState='sync';refreshAcct();
  try{const uid=cUser.uid,txt=exportTxt(),CH=400000,parts=[];for(let i=0;i<txt.length;i+=CH)parts.push(txt.slice(i,i+CH));
    const now=Date.now(),b=fbDb.batch(),ur=fbDb.collection('users').doc(uid);
    parts.forEach((p,i)=>b.set(ur.collection('data').doc('c'+i),{t:p}));for(let i=parts.length;i<(sync.n||0);i++)b.delete(ur.collection('data').doc('c'+i));
    b.set(ur,{name:profile.name||'',team:profile.team||'',n:parts.length,stamp:now,v:7},{merge:true});
    if(profile.team)b.set(fbDb.collection('teams').doc(profile.team).collection('members').doc(uid),teamSummary());
    await b.commit();sync={uid,stamp:now,dirty:false,n:parts.length};LS.set('gym_sync',sync);cState='ok';cLast=now}
  catch(e){console.warn(e);cState=navigator.onLine?'err':'offline'}cBusy=false;refreshAcct()}

function checkSet(id,i){
  const ex=EX[id],e=getEntry(id),s=e.sets[i],pv=prev(id);
  if(s.d){s.d=false;delete s.t;saveLogs();relist();return}
  const sg=sug(e,i,pv);
  if(s.w===null&&sg&&sg.w)s.w=sg.w;if(s.r===null&&sg)s.r=sg.r;
  if(s.r===null&&ex.wl===null&&!ex.sec){const it=curList().find(x=>x.id===id);const dr=parseInt((it&&it.reps)||ex.reps);if(dr)s.r=dr}
  if(s.w===null&&isOpt(ex)&&s.r!==null)s.w=0;
  if(s.w===null||s.r===null){const inp=document.querySelector(`[data-ex="${id}"][data-i="${i}"][data-f="${s.w===null?'w':'r'}"]`);inp&&inp.focus();toast(s.w===null?'Entre la charge':'Entre le nombre de '+(ex.sec?'secondes':'reps'));return}
  let msg='';
  if(ex.wl==='kg'&&s.w>0){const pb=Math.max(0,...sessionsFor(id).filter(x=>x.date!==date).map(topW));if(pb>0&&s.w>pb&&!e.sets.some((x,j)=>j!==i&&x.d&&x.w>=s.w))msg='Nouveau record : '+fr(s.w)+' kg 🎉 +50 XP'}
  s.d=true;s.t=Date.now();saveLogs();justChecked=id+'_'+i;setTimeout(()=>{justChecked=''},50);
  let nextId=null,party=!!msg;
  if(e.sets.every(x=>x.d)&&tab==='workout'){
    openEx.delete(id);const l=curList(),nx=l.find(x=>!exDone(x.id));
    if(nx){openEx.add(nx.id);nextId=nx.id;msg=msg||'Bien joué ! Suivant : '+shortName(nx.id);if(focusOn){fIdx=l.findIndex(x=>x.id===nx.id);fDir=1}}else{msg=msg||'Séance terminée 💪';party=true}
  }
  relist();toast(msg);if(party)confetti();
  if(nextId)setTimeout(()=>{const el=document.getElementById('ex-'+nextId);el&&el.scrollIntoView({behavior:'smooth',block:'start'})},60);
  else if(tab==='workout'&&!curList().some(x=>!exDone(x.id)))setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),60);
  const restLeft=e.sets.some(x=>!x.d)||nextId;if(restLeft)startTimer(ex.rest,nextId&&nextId!==id?'Repos · ensuite '+shortName(nextId):'Repos · '+shortName(id));
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;const d=t.dataset,a=d.act;
  switch(a){
  case 'go':if(d.ptab)ptab=d.ptab;if(d.jk)jkind=d.jk;if(d.go==='workout'&&tab!=='lib'){date=todayStr();sid=null;showDate=false}go(d.go);break;
  case 'start':date=todayStr();sid=d.sid;showDate=false;autoKey='';openEx.clear();go('workout');openFocus();askReady();break;
  case 'rtgo':{const ss=PROGS[progId].sessions.filter(s=>s.rt===d.v&&!s.legs),n=nextSid();date=todayStr();sid=(ss.find(s=>s.id===n)||ss[0]||{}).id||null;showDate=false;autoKey='';openEx.clear();go('workout');openFocus();askReady();break}
  case 'scan':scanStop();scanSheet();break;
  case 'scgo':{scanStop();scanBusy=true;scanLookup($('#scode').value);break}
  case 'scre':{scanStop();const p=scans[+d.v];if(p){scans=[p].concat(scans.filter(x=>x!==p));LS.set('gym_scans',scans);productSheet(p)}break}
  case 'scq':t.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b===t));$('#scqty').value=d.v;scanQtySet(d.v);break;
  case 'scadd':{const c=prodCalc(scanCur,scanQty),g=Math.round(c.pr||0);if(!g)break;const t0=todayStr(),nd=needs(),before=protSum(t0);prot[t0]=prot[t0]||[];prot[t0].push(g);LS.set('gym_prot',prot);
    closeSheet();render();toast(nd&&before<nd.P&&before+g>=nd.P?'Objectif protéines atteint ✓ +20 XP':'+'+g+' g de protéines ('+Math.round(c.kc||0)+' kcal)',2600);break}
  case 'acct':acctSheet(d.v);break;
  case 'asubmit':acctSubmit();break;
  case 'csync':if(cUser){toast('Synchronisation…');startSync(cUser).then(()=>{if(cState==='ok')toast('Synchronisé ✓')})}break;
  case 'cout':signOutCloud();break;
  case 'cdel':delSheet();break;
  case 'cdel2':deleteAccount();break;
  case 'team':if(!cUser){acctSheet('signup');break}teamSheet(d.v);break;
  case 'tsubmit':teamSubmit();break;
  case 'treload':teamCache=null;render();break;
  case 'tleave':if(confirm('Quitter l’équipe '+(profile.teamName||'')+' ?')){leaveTeam();if(ptab==='equipe')ptab='trophees';render();toast('Tu as quitté l’équipe')}break;
  case 'tshare':{const txt=`Rejoins mon équipe « ${profile.teamName} » sur Carnet — Salle & Volley !\n1. Ouvre ${location.origin+location.pathname} dans Safari et ajoute-la à l’écran d’accueil\n2. Profil → Créer un compte\n3. Rejoindre avec le code : ${profile.team}`;
    if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Invitation copiée ✓')).catch(()=>toast('Code : '+profile.team));break}
  case 'vid':{if(navigator.onLine===false){toast('Pas de réseau : la vidéo a besoin d’internet. Regarde les photos en attendant.',3200);break}
    const box=t.previousElementSibling;if(box&&box.classList.contains('exmedia')){box.innerHTML=`<div class="vidbox"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(d.v)}?autoplay=1&playsinline=1&rel=0&modestbranding=1" title="Vidéo explicative" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;t.remove()}break}
  case 'focus':openFocus();break;
  case 'fclose':closeFocus();render();if(!curList().some(x=>!exDone(x.id)))setTimeout(()=>window.scrollTo({top:document.body.scrollHeight}),30);break;
  case 'flist':fList=!fList;renderFocus();$('#focus').scrollTop=0;break;
  case 'fgo':fDir=+d.v>fIdx?1:-1;fIdx=+d.v;fList=false;renderFocus();$('#focus').scrollTop=0;break;
  case 'fstep':{const it=curList()[fIdx];if(it){const en=getEntry(it.id,it.sets),i=en.sets.findIndex(s=>!s.d);if(i>=0){stepSet(it.id,i,d.f,+d.v);renderFocus()}}break}
  case 'qs':stepSet(d.id,+d.i,d.f,+d.v);relist();break;
  case 'tadj':if(tInt){tEnd+=(+d.v)*1000;if(tEnd<Date.now())tEnd=Date.now();tTot=Math.max(tTot,Math.ceil((tEnd-Date.now())/1000));tick()}break;
  case 'fskip':clearInterval(tInt);tInt=null;$('#timer').className='';$('#focus').classList.remove('resting');break;
  case 'edit':editSheet();break;
  case 'edmv':{const ids=exOf(curSes()).slice(),j=+d.v,n=j+(+d.d);if(n<0||n>=ids.length)break;[ids[j],ids[n]]=[ids[n],ids[j]];setCustom(ids);break}
  case 'edrm':setCustom(exOf(curSes()).filter(x=>x!==d.v));toast('Exercice retiré');break;
  case 'edadd':setCustom(exOf(curSes()).concat(d.v));toast('Ajouté : '+shortName(d.v));break;
  case 'edreset':{const s=curSes();delete custom[s.id];LS.set('gym_custom',custom);$('#edbody').innerHTML=editBody();autoKey='';render();toast('Programme d’origine');break}
  case 'recapok':LS.set('gym_recap',monday(todayStr()));render();break;
  case 'calm':{const [y,m]=(calM||todayStr().slice(0,7)).split('-').map(Number),dt=new Date(y,m-1+(+d.v),1);calM=dt.getFullYear()+'-'+pad(dt.getMonth()+1);render();break}
  case 'rcat':rcat=d.v;render();break;
  case 'rmine':rmine=!rmine;render();break;
  case 'rgo':nseg='recettes';rcat='batch';render();window.scrollTo(0,0);break;
  case 'share':shareCard();break;
  case 'rready':readySheet();break;
  case 'rsave':{const sc=draft.s+draft.c+draft.p;ready[todayStr()]={s:draft.s,c:draft.c,p:draft.p,score:sc};LS.set('gym_ready',ready);closeSheet();openEx.clear();autoKey='';if(focusOn){const j=curList().findIndex(x=>!exDone(x.id));fIdx=j<0?0:j}render();toast(curMods().why.length?'Séance adaptée à ta forme':'Feu vert : séance complète 💪');break}
  case 'nodl':profile.nodl=monday(todayStr());saveProfile();openEx.clear();autoKey='';render();toast('Semaine normale');break;
  case 'stp':{const v=Math.max(0,(draft.st[d.k]||0)+(+d.v));draft.st[d.k]=v;$('#st-'+d.k).textContent=v;break}
  case 'prot':protSheet();break;
  case 'padd':case 'pundo':{const t0=todayStr(),nd=needs(),before=protSum(t0);prot[t0]=prot[t0]||[];if(a==='padd')prot[t0].push(+d.v);else prot[t0].pop();if(!prot[t0].length)delete prot[t0];LS.set('gym_prot',prot);
    if(!d.keep)render();const pb=$('#protbody');if(pb)pb.innerHTML=protBody();const af=protSum(t0);if(nd&&before<nd.P&&af>=nd.P)toast('Objectif protéines atteint ✓ +20 XP');else if(a==='padd')toast('+'+d.v+' g');break}
  case 'shopck':shop[d.v]=!shop[d.v];if(!shop[d.v])delete shop[d.v];LS.set('gym_shop',shop);render();break;
  case 'shopclear':{const g=profile.ngoal||'maintien';Object.keys(shop).forEach(x=>{if(x.startsWith(g+'|'))delete shop[x]});LS.set('gym_shop',shop);render();break}
  case 'shopshare':{const g=profile.ngoal||'maintien',txt='Courses ('+NGOALS[g].n+')\n'+SHOP[g].map(([c,items])=>{const l=items.filter(it=>!shop[g+'|'+it]);return l.length?'\n'+c+'\n'+l.map(x=>'• '+x).join('\n'):''}).join('\n');
    if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Liste copiée ✓')).catch(()=>toast('Copie impossible'));break}
  case 'rday':{const i=+d.v,r=(profile.rdays||[]).slice(),j=r.indexOf(i);if(j<0)r.push(i);else r.splice(j,1);profile.rdays=r;saveProfile();t.classList.toggle('on',j<0);t.setAttribute('aria-pressed',j<0);break}
  case 'ics':makeIcs();break;
  case 'sess':sid=d.v;openEx.clear();autoKey='';render();break;
  case 'showdate':showDate=!showDate;render();break;
  case 'grp':grp=d.v;libQ='';render();break;
  case 'tog':if(openEx.has(d.id))openEx.delete(d.id);else{openEx.add(d.id);if(d.n)getEntry(d.id,+d.n)}relist();break;
  case 'ck':checkSet(d.id,+d.i);break;
  case 'rm':getEntry(d.id).sets.splice(+d.i,1);saveLogs();relist();break;
  case 'addset':getEntry(d.id).sets.push({w:null,r:null,d:false});saveLogs();relist();break;
  case 'rest':startTimer(EX[d.id].rest,'Repos · '+shortName(d.id));break;
  case 'rpe':rpe[date]=+d.v;LS.set('gym_rpe',rpe);toast('Merci, c’est noté');render();break;
  case 'goto':date=d.v;{const e=Object.values(logs).find(x=>x.date===date&&x.sid);if(e){const p=Object.keys(PROGS).find(p=>PROGS[p].sessions.some(s=>s.id===e.sid));if(p)progId=p;sid=e.sid}else sid=null}showDate=date!==todayStr();openEx.clear();autoKey='';go('workout');break;
  case 'ptab':ptab=d.v;render();break;
  case 'jk':jkind=d.v;render();break;
  case 'goal':profile[d.k]=+d.v;saveProfile();render();break;
  case 'setprog':progId=d.v;saveProg();sid=null;render();toast('Programme : '+PROGS[progId].name);break;
  case 'editmatch':{const box=$('#matchedit'),inp=$('#matchd');box.hidden=false;try{inp.showPicker?inp.showPicker():inp.focus()}catch(e){inp.focus()}break}
  case 'clearmatch':match='';LS.set('gym_match',match);render();break;
  case 'delvb':if(confirm('Supprimer cette séance de volley ?')){volley=volley.filter(v=>v.id!==d.id);saveVolley();render()}break;
  case 'deljump':if(confirm('Supprimer ce test ?')){jumps=jumps.filter(j=>j.id!==d.id);saveJumps();render()}break;
  case 'sheet-test':tk=d.tk||(tab==='progress'&&ptab==='detente'?jkind:'cmj');testSheet();break;
  case 'sheet-vb':vbSheet();break;
  case 'sheet-sensor':sensorSheet();break;
  case 'closesheet':closeSheet();break;
  case 'opt':{const g=t.closest('.opts');g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));draft[d.k]=isNaN(+d.v)||d.k==='date'?d.v:+d.v;break}
  case 'wprog':t.parentNode.querySelectorAll('.choice').forEach(b=>b.classList.toggle('on',b===t));draft.prog=d.v;break;
  case 'wdone':profile.name=$('#w-name').value.trim();profile.goalVb=draft.goalVb;profile.goalGym=draft.goalGym;profile.onb=1;saveProfile();progId=draft.prog||progId;saveProg();sid=null;closeSheet();render();toast(profile.name?'Bienvenue '+profile.name+' !':'C’est parti !');break;
  case 'tk':tk=d.v;testSheet();break;
  case 'savetest':{const v=num($('#t-val').value),dt=($('#t-date')&&$('#t-date').value)||todayStr();if(!v||v<=0){toast('Entre ta mesure');$('#t-val').focus();return}
    const prevBest=bestJ(tk);jumps.push({id:uid(),date:dt,kind:tk,val:v,method:'manuel',note:($('#t-note')&&$('#t-note').value.trim())||''});saveJumps();
    closeSheet();toast(prevBest!=null&&v>prevBest?'Nouveau record ! 🚀':'Test enregistré ✓');if(prevBest!=null&&v>prevBest)confetti();jkind=tk;render();break}
  case 'savevb':{const st=draft.st&&Object.values(draft.st).some(x=>x>0)?Object.assign({},draft.st,{att:Math.max(draft.st.att,draft.st.kill)}):null;
    const v={id:uid(),date:draft.date||todayStr(),type:draft.type||'entr',min:+draft.min||120,rpe:+draft.rpe||5,note:($('#v-note')&&$('#v-note').value.trim())||''};if(st)v.st=st;
    volley.push(v);saveVolley();closeSheet();toast('Séance de volley notée ✓ +'+(v.type==='match'?80:60)+' XP');render();break}
  case 'sensgo':sensGo();break;
  case 'senssave':if(sens.att.length){const b=Math.max(...sens.att),pb=bestJ('cmj');jumps.push({id:uid(),date:todayStr(),kind:'cmj',val:b,method:'capteur'});saveJumps();closeSheet();toast(pb!=null&&b>pb?'Nouveau record : '+b+' cm 🚀':'Détente enregistrée : '+b+' cm');if(pb!=null&&b>pb)confetti();jkind='cmj';render()}break;
  case 'nseg':nseg=d.v;render();break;
  case 'nmom':nmom=d.v;render();break;
  case 'ngoal':profile.ngoal=d.v;saveProfile();render();break;
  case 'psexe':profile.sexe=d.v;saveProfile();t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));break;
  case 'nrefresh':if(!needs())toast('Il manque une info');render();break;
  case 'addw':{const v=num($('#wkg').value);if(!v||v<25||v>250){toast('Entre ton poids en kg');$('#wkg').focus();return}
    const t0=todayStr();weights=weights.filter(x=>x.date!==t0);weights.push({id:uid(),date:t0,kg:v});saveWeights();profile.poids=v;saveProfile();toast('Pesée enregistrée ✓');render();break}
  case 'delw':weights=weights.filter(x=>x.id!==d.id);saveWeights();render();break;
  case 'dl':download();break;
  case 'file':$('#bkfile').click();break;
  case 'copy':{const txt=exportTxt(),m=$('#bkmsg'),ta=$('#bk');ta.value=txt;
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{markBk();m.textContent='Copié ! Colle-le dans une note pour le garder.'}).catch(()=>{ta.select();m.textContent='Sélectionne et copie le texte ci-dessus.'});break}
  case 'paste':{const m=$('#bkmsg');try{const n=importTxt($('#bk').value);render();toast(n+' élément(s) importé(s)')}catch(e){m.textContent='Sauvegarde invalide.'}break}
  case 'install':if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()})}break;
  case 'hideinstall':LS.set('gym_hideinstall',true);render();break;
  }
  queueGame();
});
function askReady(){const t0=todayStr();if(!ready[t0]&&!Object.values(logs).some(e=>e.date===t0&&hasData(e)))readySheet()}
document.addEventListener('input',ev=>{
  const t=ev.target,d=t.dataset||{};
  if(d.f){getEntry(d.ex).sets[+d.i][d.f]=num(t.value);saveLogs()}
  else if(d.note){getEntry(d.note).note=t.value;saveLogs()}
  else if(d.pf){const v=t.value;profile[d.pf]=['taille','poids','reach','net','age'].includes(d.pf)?(num(v)??''):v;saveProfile()}
  else if(t.id==='scqty'){scanQtySet(t.value);document.querySelectorAll('[data-act=scq]').forEach(b=>b.classList.toggle('on',+b.dataset.v===scanQty))}
  else if(t.id==='edq'){edQ=t.value;$('#edcand').innerHTML=editCand(candFor())}
  else if(t.id==='libq'){libQ=t.value;$('#libl').innerHTML=libList();document.querySelectorAll('.chip[data-act=grp]').forEach(c=>c.classList.toggle('on',!libQ&&c.dataset.v===grp))}
  else if(t.id==='t-rj'){const r=reach(),v=num(t.value);if(r&&v)$('#t-val').value=Math.round((v-r)*10)/10}
  else if(t.id==='t-val'&&$('#t-calc')){const v=num(t.value),r=reach();$('#t-calc').textContent=v?`${r?'Détente : '+Math.round(v-r)+' cm · ':''}${sgn(Math.round(v-net()))} cm au-dessus du filet`:''}
});
document.addEventListener('change',ev=>{
  const t=ev.target,d=t.dataset||{};
  if(t.id==='dt'&&t.value){date=t.value;sid=null;openEx.clear();autoKey='';render()}
  else if(t.id==='pex'){pex=t.value;render()}
  else if(t.id==='matchd'){match=t.value;LS.set('gym_match',match);render()}
  else if(d.pf){if(['poste','net','name'].includes(d.pf)&&tab==='profile')render();queueGame()}
  else if(d.swap){const o=d.swap,v=t.value,cur=(swaps[sid]||{})[o]||o;swaps[sid]=swaps[sid]||{};if(v===o)delete swaps[sid][o];else swaps[sid][o]=v;LS.set('gym_swaps',swaps);openEx.delete(cur);openEx.add(v);render()}
  else if(t.id==='bkfile'&&t.files&&t.files[0]){const f=t.files[0];f.text().then(txt=>{const n=importTxt(txt);render();toast(n+' élément(s) restauré(s)')}).catch(()=>toast('Fichier invalide'));t.value=''}
  else if(d.f&&tab!=='lib')render();
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(tab==='home'&&!typing()&&$('#sheet').hidden)render()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;LS.set('gym_hideinstall',true);if(!typing())render()});

// Balayage gauche / droite en mode plein écran
{const F=$('#focus');let fx=null,fy=0;
 F.addEventListener('touchstart',e=>{if(e.target.closest('input')||F.classList.contains('resting')||fList){fx=null;return}const t=e.touches[0];fx=t.clientX;fy=t.clientY},{passive:true});
 F.addEventListener('touchend',e=>{if(fx===null)return;const t=e.changedTouches[0],dx=t.clientX-fx,dy=t.clientY-fy;fx=null;
   if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){const j=fIdx+(dx<0?1:-1);if(j>=0&&j<curList().length){fDir=dx<0?1:-1;fIdx=j;renderFocus();F.scrollTop=0}}},{passive:true})}
render();checkGame();
// Compte : on se reconnecte automatiquement si on l’était, et on envoie avant que l’appli passe en arrière-plan
if(sync.uid)loadFb().catch(()=>{cState='offline'});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&cUser&&sync.dirty){clearTimeout(cT);pushCloud()}});
window.addEventListener('online',()=>{if(cUser&&sync.dirty)pushCloud()});
if(!profile.onb){if(sessionDates().length||volley.length){profile.onb=1;saveProfile()}else welcomeSheet()}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
