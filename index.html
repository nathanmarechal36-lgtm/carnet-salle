.sheet{position:fixed;inset:0;z-index:40}.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.65);animation:fade .2s}
.sheet-p{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
@keyframes up{from{transform:translateY(60px);opacity:.3}}@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-20px);background:var(--acc);color:var(--acc-ink);font-weight:750;font-size:14.5px;padding:11px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.big-num{font-size:64px;font-weight:800;text-align:center;color:var(--acc);letter-spacing:-.04em;line-height:1;margin:22px 0 8px;font-variant-numeric:tabular-nums}
details>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
details>summary::-webkit-details-marker{display:none}
details>summary .i{transition:transform .2s;color:var(--mute)}details[open]>summary>.i:last-child{transform:rotate(90deg)}
.det{margin-top:10px;color:#cdc8d3;font-size:14.5px}
.det ul{margin:6px 0;padding-left:18px}.det li{margin:5px 0}.det .err li{color:var(--mute)}
.det h4{margin:12px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.gauge{display:flex;gap:18px;align-items:center}
.badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:750}
.search{position:relative}.search .i{position:absolute;left:15px;top:50%;margin-top:-10px;color:var(--mute)}.search input{padding-left:44px;border-radius:999px;background:var(--card)}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}.steps li{counter-increment:s;position:relative;padding:4px 0 10px 38px;font-size:14.5px}
.steps li::before{content:counter(s);position:absolute;left:0;top:3px;width:26px;height:26px;border-radius:50%;background:var(--accd);color:var(--acc);font-weight:800;font-size:13px;display:grid;place-items:center}
.vchip{display:inline-flex;align-items:center;gap:8px}
.daterow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;font-size:14px;color:var(--mute)}
.lvrow{display:flex;align-items:center;gap:14px}
.lvb{width:52px;height:52px;border-radius:17px;background:var(--yel);color:#17150a;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.strk{text-align:center;flex:none;line-height:1.1}.strk b{display:block;font-size:19px;font-weight:800}.strk small{font-size:11px;color:var(--mute)}
.chl{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.chl:first-child{border-top:0}
.chl .cc{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--card2);color:var(--mute)}.chl .cc .i{width:15px;height:15px}.chl .cc.ok{background:var(--acc);color:var(--acc-ink)}.chl .cc.ok .i{stroke-width:3}
.chl .xp{color:var(--yel);font-weight:750;font-size:12px;white-space:nowrap}.chl .pbar{height:4px;margin-top:6px}
.chl.ok .lb{color:var(--mute);text-decoration:line-through}
.bdgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.bdg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center}
.bdg .e{font-size:30px;line-height:1.1}.bdg b{display:block;font-size:12.5px;margin-top:8px;line-height:1.2}.bdg small{display:block;font-size:11px;color:var(--mute);margin-top:4px;line-height:1.25}
.bdg.off .e{filter:grayscale(1);opacity:.3}.bdg.off b{color:var(--mute)}.bdg .pbar{height:4px;margin-top:8px}
.bdg.ok{border-color:#3d3420;background:radial-gradient(120% 100% at 50% 0%,rgba(250,204,21,.16),transparent 70%),var(--card)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.pgrid button{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;cursor:pointer}.pgrid b{display:block;color:var(--acc);font-size:17px}.pgrid small{color:var(--mute);font-size:12.5px;line-height:1.3;display:block;margin-top:2px}
.stp{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.stp:first-child{border-top:0}.stp span{flex:1;font-size:14.5px}.stp button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:20px;font-weight:700;cursor:pointer}.stp b{width:34px;text-align:center;font-size:19px}
.shop{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14.5px}.shop .bx{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}.shop.on{color:var(--mute);text-decoration:line-through}.shop.on .bx{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.shop .bx .i{width:15px;height:15px;stroke-width:3}
.shopcat{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:750;margin:18px 0 2px}.shopcat:first-child{margin-top:0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.days button{height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--card2);font-weight:750;cursor:pointer}.days button.on{border-color:var(--acc);background:var(--accd);color:var(--acc)}
/* ---- v7 : couleurs par section ---- */
body{--tc:var(--acc);--tci:#fff}body[data-tab=volley]{--tc:var(--vio)}body[data-tab=nutri]{--tc:var(--yel);--tci:#17120a}body[data-tab=progress]{--tc:var(--blu);--tci:#04151c}
.nav button.on{color:var(--tc)}.nav button.on::before{background:var(--tc)}
.seg button.on,.chip.on{background:var(--tc);border-color:var(--tc);color:var(--tci)}
.btn[disabled]{opacity:.35;pointer-events:none}
/* ---- Accueil ---- */
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.mini{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 6px 12px;cursor:pointer;min-width:0}
.mini>span{font-size:12.5px;color:var(--mute);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hero .sub2{display:flex;justify-content:center;margin-top:8px}
.recap{border-color:#1f3a46;background:radial-gradient(120% 100% at 100% 0%,rgba(96,165,250,.18),transparent 60%),var(--card)}.recap .t{color:var(--blu)}
.recap ul{margin:12px 0 0;padding-left:18px;font-size:14px}.recap li{margin:4px 0}
/* ---- Muscles ---- */
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.mchips span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accd);color:var(--acc)}.mchips span.s{background:var(--card2);color:var(--mute)}
.bmap{display:block;width:100%;max-width:300px;height:auto;margin:6px auto 0}
.bmleg{display:flex;justify-content:center;gap:14px;font-size:11.5px;color:var(--mute);margin-top:4px}.bmleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* ---- Boutons + / − sous la série en cours ---- */
.set.qs{margin:-3px 0 10px}.qg{display:flex;gap:6px}.qg button{flex:1;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card2);font-size:19px;font-weight:700;cursor:pointer;color:var(--ink);padding:0}
.qg button:active{background:var(--accd);border-color:var(--acc)}
.plate{font-size:12.5px;color:var(--mute);margin:-2px 0 8px 36px}.plate b{color:var(--ink);font-weight:650}
/* ---- Mode séance plein écran ---- */
#focus{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
body.focus #focus{display:block}body.focus{overflow:hidden}body.focus #timer,body.focus .nav{display:none!important}
#fmain{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 16px)}
.f-top{display:flex;align-items:center;gap:12px}.f-top .f-pr{flex:1;min-width:0}.f-top .pbar{margin-top:6px;height:6px}
.f-name{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin-top:22px}
.f-sub{color:var(--mute);font-size:14px;margin-top:4px}
.f-set{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);font-weight:750;margin:24px 0 4px;text-align:center}
.fst{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:10px;margin:10px 0}
.fst button{width:66px;height:66px;border-radius:19px;border:1px solid var(--line);background:var(--card2);font-size:30px;font-weight:700;flex:none;cursor:pointer;color:var(--ink)}
.fst button:active{background:var(--accd);border-color:var(--acc);color:var(--acc)}
.fst .fv{flex:1;text-align:center;min-width:0}
.fst input{background:none;border:0;text-align:center;font-size:46px;font-weight:800;padding:0;letter-spacing:-.03em;font-variant-numeric:tabular-nums;border-radius:0;height:56px}
.fst input.sg{color:#d6d1dc}.fst input::placeholder{color:#4f4a56}
.fst small{display:block;color:var(--mute);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.f-ok{min-height:74px;border-radius:24px;font-size:19px;margin-top:10px}.f-ok .i{width:24px;height:24px;stroke-width:3}
.f-sets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.f-sets span{font-size:12.5px;padding:6px 11px;border-radius:999px;background:var(--card2);color:var(--mute);font-weight:650}
.f-sets span.ok{background:var(--accd);color:var(--acc)}.f-sets span.nx{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--ink)}
.f-nav{display:flex;gap:10px;margin-top:auto;padding-top:22px}.f-nav .btn{flex:1}
.f-li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin:8px 0;cursor:pointer}
.f-li.on{border-color:var(--acc)}.f-li .mid{flex:1;min-width:0}.f-li b{display:block;font-size:15px}.f-li small{color:var(--mute);font-size:12.5px}
.f-swipe{text-align:center;font-size:12px;color:#5c5763;margin-top:10px}
#frest{position:fixed;inset:0;z-index:2;background:radial-gradient(90% 60% at 50% 40%,rgba(255,59,48,.12),transparent 70%),var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#focus.resting #frest{display:flex}
#frc{transition:stroke-dashoffset .25s linear}
.slL{animation:slL .28s cubic-bezier(.2,.8,.2,1)}.slR{animation:slR .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slL{from{opacity:0;transform:translateX(36px)}}@keyframes slR{from{opacity:0;transform:translateX(-36px)}}
/* ---- Recettes ---- */
.rmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rmeta span{font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--mute)}.rmeta span.p{background:var(--accd);color:var(--acc)}
.demo{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:10px 10px 12px;margin:4px 0 2px}.demo svg{display:block;width:100%;max-width:300px;height:auto;margin:0 auto}
.exph{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/2;background:#000}.exph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.exph img.b{animation:phx 3.2s ease-in-out infinite}@keyframes phx{0%,35%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
.exph span{position:absolute;left:10px;bottom:10px;font-size:11.5px;font-weight:750;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;letter-spacing:.04em}
.exph .ph1{opacity:0;animation:phx 3.2s ease-in-out infinite;background:var(--acc);color:var(--acc-ink)}.exph .ph0{animation:phy 3.2s ease-in-out infinite}@keyframes phy{0%,35%{opacity:1}50%,85%{opacity:0}100%{opacity:1}}
.vidbox{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000}.vidbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bmcard{display:grid;grid-template-columns:1fr;gap:10px}
.scanbox{position:relative;margin-top:14px;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:4/3}.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:3px solid var(--acc);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanframe::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d;animation:scl 1.6s ease-in-out infinite}
@keyframes scl{0%,100%{transform:translateY(-30px)}50%{transform:translateY(30px)}}
.ing{margin:6px 0;padding-left:18px}.ing li{margin:4px 0}
/* ---- Calendrier ---- */
.calh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.calh h3{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:11px;color:var(--mute);text-align:center;font-weight:700}
.cal .d{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-size:13px;background:var(--card2);color:var(--mute);font-weight:650;position:relative;border:0;padding:0}
.cal .d.g{background:var(--acc);color:var(--acc-ink);cursor:pointer}.cal .d.v{background:var(--vio);color:#120f1c}.cal .d.g.v{background:linear-gradient(135deg,var(--acc) 50%,var(--vio) 50%)}
.cal .d.td{box-shadow:0 0 0 2px var(--ink)}.cal .d.m::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--ora)}.cal .d.o{visibility:hidden}
/* ---- Animations ---- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes ringIn{from{stroke-dashoffset:var(--c)}}@keyframes grow{from{width:0}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
#view.anim>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
#view.anim>*:nth-child(2){animation-delay:.03s}#view.anim>*:nth-child(3){animation-delay:.06s}#view.anim>*:nth-child(4){animation-delay:.09s}#view.anim>*:nth-child(5){animation-delay:.12s}#view.anim>*:nth-child(n+6){animation-delay:.15s}
#view.anim .rg{animation:ringIn 1s cubic-bezier(.2,.8,.2,1) both}#view.anim .pbar i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.pop{animation:pop .38s cubic-bezier(.2,.8,.2,1)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
/* ===================== DA « Yosha » : encre, vermillon, manga ===================== */
@font-face{font-family:'Anton';src:url(anton.woff2) format('woff2');font-display:swap}
:root{--disp:'Anton',Impact,'Arial Narrow',sans-serif;--jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}
body{background:radial-gradient(130% 55% at 50% -12%,rgba(255,59,48,.17),transparent 62%) no-repeat,var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.075) 1px,transparent 1.5px);background-size:7px 7px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 34%);mask-image:linear-gradient(180deg,#000,transparent 34%)}
#view{position:relative}
h1,h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.012em}
h1{font-size:36px;line-height:1.02;margin-top:6px}h2{font-size:30px;line-height:1.04}
.f-name,.bignum,.big-num,.tile b,.kpi b,.stats3 b,.ring-in b{font-family:var(--disp);font-weight:400;letter-spacing:.01em}
.f-name{text-transform:uppercase;font-size:34px;line-height:1.02}
.hello{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;font-weight:750}
.hello .jp{font-family:var(--jp);letter-spacing:.2em;color:var(--tc);margin-right:8px;font-weight:800}
/* Cartes : verre fumé */
.card,.ex,.kpi,.tile,.mini,.bigact button,.bdg{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.008)),var(--card);border-color:rgba(255,255,255,.075)}
.ex.open{border-color:rgba(255,59,48,.45);box-shadow:0 0 0 1px rgba(255,59,48,.12),0 14px 34px rgba(0,0,0,.35)}
/* Hero : case de manga (coin coupé, traits de vitesse, kanji vertical) */
.hero{border-radius:22px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(155deg,#2b1215 0%,#160d10 52%,#0e0c10 100%);clip-path:polygon(0 0,100% 0,100% calc(100% - 28px),calc(100% - 28px) 100%,0 100%);padding:26px 22px 28px}
.hero.vb{background:linear-gradient(155deg,#1b1733 0%,#110f1c 55%,#0d0c11 100%)}
.hero.nu{background:linear-gradient(155deg,#2a2110 0%,#16120b 55%,#0e0c0b 100%)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(-24deg,transparent 0 13px,rgba(255,255,255,.035) 13px 14px)}
.hero[data-k]::after{content:attr(data-k);position:absolute;right:14px;top:16px;font:900 15px/1.15 var(--jp);color:var(--tc);opacity:.85;writing-mode:vertical-rl;letter-spacing:.25em;pointer-events:none}
.hero .ph{position:absolute!important;inset:0;background-size:cover;background-position:70% 30%;filter:grayscale(1) contrast(1.25) brightness(.85);opacity:.32;-webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 85%);mask-image:linear-gradient(100deg,transparent 30%,#000 85%);pointer-events:none}
.hero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,59,48,.55),rgba(255,59,48,0) 70%);mix-blend-mode:multiply}
.hero .big{opacity:.07}
.hero p{color:#cfcad6}
.meta-row{color:#d8d3de}
.tag{border-radius:4px;transform:skewX(-9deg);font-family:var(--disp);font-weight:400;font-size:13px;letter-spacing:.07em;background:var(--acc);color:#fff;padding:5px 12px 4px}
.tag .i{display:none}
/* Boutons */
.btn.acc{background:linear-gradient(180deg,#ff5a4c,#e2261d);border-color:transparent;color:#fff;box-shadow:0 10px 26px rgba(255,59,48,.32),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.block{text-transform:uppercase;letter-spacing:.035em;font-weight:800}
.btn{border-color:rgba(255,255,255,.09)}
/* Titres de section : trait oblique */
.sect-h h3::before,.wsec b::before{content:"";display:inline-block;width:5px;height:15px;background:var(--tc);transform:skewX(-16deg);margin-right:9px;vertical-align:-2px;border-radius:1px}
.wsec b::before{margin-right:2px}
/* Barre de navigation flottante, bouton central « tampon » */
.nav{left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;border-radius:26px;border:1px solid rgba(255,255,255,.09);background:rgba(18,16,21,.86);padding:0 6px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.nav button.on::before{top:auto;bottom:7px;width:5px;height:5px;border-radius:50%}
.nav .ctrb{width:54px;height:54px;border-radius:18px;background:linear-gradient(180deg,#ff5a4c,#d9231b);display:grid;place-items:center;color:#fff;margin-top:-30px;box-shadow:0 10px 24px rgba(255,59,48,.45),inset 0 1px 0 rgba(255,255,255,.3);transform:rotate(-6deg);transition:transform .2s}
.nav button.ctr{color:var(--ink)}.nav button.ctr.on::before{display:none}.nav button.ctr.on .ctrb{transform:rotate(0) scale(1.06)}
#timer{bottom:calc(var(--nav) + 22px + env(safe-area-inset-bottom))}
/* Pourquoi cet exercice pour ton sport */
.why{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 13px;border-radius:14px;background:var(--viod);border:1px solid rgba(139,123,255,.25);font-size:13.5px;line-height:1.4;color:#dcd8ff}
.why .i{width:17px;height:17px;color:var(--vio);margin-top:1px}.why b{color:#fff}
/* Choix du sport */
.sports{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sports button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px 12px;border-radius:18px;border:1.5px solid var(--line);background:var(--card2);cursor:pointer;font-weight:750;font-size:13.5px}
.sports button .i{width:26px;height:26px;color:var(--mute)}
.sports button.on{border-color:var(--vio);background:linear-gradient(var(--viod),var(--viod)),var(--card2)}.sports button.on .i{color:var(--vio)}
/* Repos : traits de vitesse */
#frest{background:repeating-linear-gradient(-24deg,transparent 0 16px,rgba(255,59,48,.06) 16px 17px),radial-gradient(90% 60% at 50% 40%,rgba(255,59,48,.14),transparent 70%),var(--bg)}
/* Onomatopée manga (série / exercice validé) */
.mfx{position:fixed;left:50%;top:38%;z-index:80;pointer-events:none;text-align:center;transform:translate(-50%,-50%) rotate(-8deg);animation:mfx 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.mfx b{display:block;font:900 74px/1 var(--jp);color:#fff;-webkit-text-stroke:3px #0b0a0d;paint-order:stroke fill;text-shadow:6px 6px 0 var(--acc)}
.mfx span{display:inline-block;margin-top:8px;font:400 20px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;background:#fff;color:#0b0a0d;padding:5px 12px 3px;transform:skewX(-10deg)}
@keyframes mfx{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1.12)}30%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) rotate(-8deg) scale(1)}}
.lvb{font-family:var(--disp);font-weight:400;border-radius:12px;transform:rotate(-5deg)}
#toast{border-radius:6px;transform:translate(-50%,-20px) skewX(-8deg);font-family:var(--disp);font-weight:400;letter-spacing:.04em;text-transform:uppercase;font-size:14.5px;line-height:1.2;box-shadow:5px 5px 0 #0b0a0d;width:max-content;max-width:calc(100% - 40px)}
#toast.show{transform:translate(-50%,0) skewX(-8deg)}
/* ---- v9 : arcs, niveau supérieur, chrono, journal, eau, blessures ---- */
.arc{padding:16px 18px;background:repeating-linear-gradient(-24deg,transparent 0 12px,rgba(255,59,48,.045) 12px 13px),linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.008)),var(--card)}
.arck{font:800 12px/1 var(--jp);color:var(--acc);letter-spacing:.14em}
.arcn{font-family:var(--disp);font-weight:400;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin-top:6px}
.arcb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.arcb i{height:8px;border-radius:2px;background:var(--line);transform:skewX(-18deg)}.arcb i.on{background:var(--acc)}
.lvup{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;
 background:repeating-linear-gradient(-24deg,transparent 0 16px,rgba(255,59,48,.09) 16px 17px),radial-gradient(80% 50% at 50% 42%,rgba(255,59,48,.28),transparent 70%),rgba(11,10,13,.97);animation:fade .25s}
.lvup>*{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}.lvup>*:nth-child(2){animation-delay:.08s}.lvup>*:nth-child(3){animation-delay:.16s}.lvup>*:nth-child(4){animation-delay:.24s}
.lvk{font:900 34px/1 var(--jp);color:var(--acc);letter-spacing:.2em}
.lvt{font:400 18px/1 var(--disp);text-transform:uppercase;letter-spacing:.14em;background:#fff;color:#0b0a0d;padding:7px 14px 5px;margin-top:16px;transform:skewX(-10deg)}
.lvn{font:400 150px/1 var(--disp);color:#fff;text-shadow:8px 8px 0 var(--acc);margin-top:10px}
.lvr{font:400 34px/1.05 var(--disp);text-transform:uppercase;letter-spacing:.03em}
.chrono{margin-top:14px;padding:6px 14px 14px;border-radius:20px;background:var(--bg2);border:1px solid var(--line)}.chrono .big-num{color:var(--ink);font-family:var(--disp);font-weight:400;font-size:72px;margin:14px 0 12px}
.glass{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.glass i{width:22px;height:28px;border:2px solid var(--blu);border-top:0;border-radius:0 0 7px 7px;opacity:.35}.glass i.on{background:linear-gradient(transparent 25%,var(--blu) 25%);opacity:1}
.inj{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.inj button{padding:13px 4px;border-radius:15px;border:1.5px solid var(--line);background:var(--card2);font-weight:750;cursor:pointer;font-size:14px}
.inj button.on{border-color:var(--ora);background:var(--orad);color:var(--ora)}
.jrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.jrow:first-child{border-top:0}.jrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.jrow b{font-weight:700;white-space:nowrap}
.motto{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:9px 13px;border-left:4px solid var(--acc);background:linear-gradient(90deg,rgba(255,59,48,.10),transparent);font-size:14px;font-weight:650;font-style:italic;color:#e9e4ee}
.motto span{font:900 13px/1 var(--jp);color:var(--acc);font-style:normal;letter-spacing:.12em;flex:none}
.coach{display:inline-block;font:400 11px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;background:var(--yel);color:#17120a;padding:3px 7px 2px;border-radius:4px;transform:skewX(-8deg);margin-left:6px;vertical-align:2px}
.vjv{position:relative;margin-top:14px;border-radius:18px;overflow:hidden;background:#000}.vjv video{display:block;width:100%;max-height:52vh;object-fit:contain}
.vjctl{display:flex;align-items:center;gap:8px;margin-top:10px}.vjctl .btn{flex:1}.vjctl span{flex:none;font-variant-numeric:tabular-nums;font-weight:750;min-width:74px;text-align:center}
input[type=range]{padding:0;height:34px;background:none;border:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--acc)}
.vjsnap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.vjsnap div{text-align:center}.vjsnap canvas{width:100%;border-radius:10px;background:var(--bg2);display:block;aspect-ratio:3/4;object-fit:cover}.vjsnap small{display:block;color:var(--mute);font-size:11.5px;margin-top:4px}
/* ---- v12 : visite guidée, annuler, hors ligne, texte plus grand, favoris ---- */
:root{--mute:#9d98a5}
body.big #view,body.big #fmain,body.big .sheet-p{zoom:1.12}
.tour{position:fixed;inset:0;z-index:85}
.tour-hole{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(5,4,7,.78);outline:2px solid var(--acc);outline-offset:3px;transition:top .3s var(--ease-out),left .3s var(--ease-out),width .3s var(--ease-out),height .3s var(--ease-out);pointer-events:none}
.tour-tip{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:#fff;color:#0b0a0d;border-radius:18px;padding:16px 16px 12px;box-shadow:6px 6px 0 var(--acc);animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.tour-tip b{display:block;font:400 18px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.tour-tip p{margin:0;font-size:14.5px;line-height:1.45}
.tour-tip .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.tour-tip .row span{display:flex;gap:4px;align-items:center}.tour-tip small{color:#6b6672;font-weight:700}
.tour-tip button{border:0;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer}.tour-tip .nx{background:var(--acc);color:#fff}.tour-tip .sk{background:none;color:#6b6672}
#undo{position:fixed;left:14px;right:14px;bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom));max-width:532px;margin:0 auto;z-index:62;display:flex;align-items:center;gap:12px;background:#f6f3ee;color:#0b0a0d;border-radius:16px;padding:12px 12px 12px 16px;font-weight:700;font-size:14.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:up .25s cubic-bezier(.2,.8,.2,1)}
#undo span{flex:1}#undo button{border:0;background:var(--acc);color:#fff;font-weight:800;border-radius:11px;padding:9px 14px;cursor:pointer}
#undo i{position:absolute;left:12px;right:12px;bottom:5px;height:3px;border-radius:3px;background:rgba(0,0,0,.12);overflow:hidden}#undo i::after{content:"";position:absolute;inset:0;background:var(--acc);animation:undo 5s linear forwards}
@keyframes undo{to{transform:translateX(-100%)}}
body.focus #undo{bottom:calc(16px + env(safe-area-inset-bottom))}
#off{position:fixed;left:0;right:0;top:0;z-index:58;padding:calc(env(safe-area-inset-top) + 6px) 14px 6px;text-align:center;font-size:12.5px;font-weight:750;background:#2a2630;color:#f6f3ee;display:none}
body.offline #off{display:block}
.favb{background:none;border:0;color:var(--yel);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}.setrow:first-of-type{border-top:0}.setrow div{flex:1}.setrow small{display:block;color:var(--mute);font-size:12.5px}
.invite{border-color:rgba(255,200,61,.4);background:radial-gradient(120% 100% at 100% 0%,rgba(255,200,61,.15),transparent 60%),var(--card)}
/* ---- v14 : vert = validé / équilibré ; le rouge reste l’identité et les alertes ---- */
:root{--goodd:rgba(61,220,151,.14)}
.st.done,.ck.on,.chl .cc.ok,.shop.on .bx{background:var(--good);border-color:var(--good);color:#06150e}.st.part{color:var(--ink);background:var(--card2)}
.set.ok input{border-color:rgba(61,220,151,.45);color:var(--good)}.set.ok .n,.f-sets span.ok{background:var(--goodd);color:var(--good)}
.ok-box{border-color:rgba(61,220,151,.35);background:linear-gradient(var(--goodd),var(--goodd)),var(--card)}.ok-box .t{color:var(--good)}
.goal{color:var(--ink)}.goal .i{color:var(--yel)}
/* ---- v16 : fiche de personnage ---- */
.fiche{position:relative;overflow:hidden;margin:18px 0 12px;padding:22px 20px 6px;border-radius:22px;border:1px solid rgba(255,255,255,.1);background:repeating-linear-gradient(-24deg,transparent 0 13px,rgba(255,255,255,.03) 13px 14px),linear-gradient(160deg,#2b1215,#150d10 55%,#0e0c10);clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%)}
.fiche>*{position:relative}.fiche .fk{position:absolute;right:-10px;top:-24px;font:900 190px/1 var(--jp);color:rgba(255,255,255,.06);pointer-events:none}
.fiche h2{font-size:34px;margin-top:4px}.farch{display:inline-block;margin-top:8px;background:#fff;color:#0b0a0d;font:400 20px/1 var(--disp);text-transform:uppercase;letter-spacing:.04em;padding:7px 12px 5px;transform:skewX(-9deg)}
.fiche.locked .farch{background:var(--card2);color:var(--mute)}
.ftags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.ftags span{font-size:12px;font-weight:750;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.radar{display:block;width:100%;max-width:330px;margin:6px auto 0;overflow:visible}
.radp{animation:radIn .9s cubic-bezier(.2,.9,.25,1.2) both .15s}@keyframes radIn{from{transform:scale(.6) rotate(-25deg);opacity:0}}
.rk{font-family:var(--disp);font-weight:400;font-style:normal}.radar .rk{fill:var(--mute)}
.rkS{color:#ffc83d;fill:#ffc83d!important;text-shadow:0 0 12px rgba(255,200,61,.6)}.rkA{color:#ff3b30;fill:#ff3b30!important}.rkB{color:#3ddc97;fill:#3ddc97!important}.rkC{color:#3ad0ff;fill:#3ad0ff!important}.rkD,.rkE{color:var(--ink);fill:var(--ink)!important}
.frow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.frow:first-child{border-top:0}.frow .rk{font-size:24px;line-height:1}
.fkj{width:36px;height:36px;border-radius:10px;background:var(--accd);color:var(--acc);display:grid;place-items:center;font:900 18px/1 var(--jp);flex:none}
.fmini{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}.fmini b{display:block;font-family:var(--disp);font-weight:400;font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.fmk{width:46px;height:46px;border-radius:13px;background:linear-gradient(180deg,#ff5a4c,#d9231b);color:#fff;display:grid;place-items:center;font:900 24px/1 var(--jp);flex:none;transform:rotate(-6deg)}
.frk{display:flex;gap:4px}.frk i{font-size:18px}
/* ---- v17 : personnage, sections ---- */
.spw{display:block;position:relative}.sprite{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.perso{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;overflow:visible}
.perso .psp{flex:none;width:112px;margin:-10px -8px -10px -10px}.perso .pmain{flex:1;min-width:0}
.bubble{position:relative;background:#fff;color:#0b0a0d;font-size:13px;font-weight:700;line-height:1.35;padding:8px 11px;border-radius:12px;margin-bottom:9px}
.bubble::before{content:"";position:absolute;left:-7px;top:14px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.parch{display:block;font-family:var(--disp);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.fsp{position:absolute!important;right:4px;top:30px;width:112px}
.fiche .fhead{padding-right:96px}
.frow .rk{font-size:17px;letter-spacing:.03em}
.avedit{display:flex;gap:12px;align-items:flex-start}.avside{flex:1;min-width:0}.avrow{margin:10px 0 0}.avrow>span{display:block;font-size:12.5px;font-weight:750;color:var(--mute);margin-bottom:6px}
.avnum{align-items:center}.avnum b{min-width:42px;text-align:center;font-family:var(--disp);font-weight:400;font-size:22px}.avprev{flex:none;width:112px;background:radial-gradient(circle,rgba(255,59,48,.12),transparent 70%);border-radius:16px}
.avopts{display:flex;gap:5px;flex-wrap:wrap}.avopts button{min-width:30px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--card2);font-size:12.5px;font-weight:750;cursor:pointer;padding:0 8px;display:grid;place-items:center}
.avopts button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.avopts button{position:relative}.avopts button.lock{opacity:.55}.avopts button.lock em{position:absolute;right:-5px;top:-7px;font-size:11px;font-style:normal}.avopts i{width:18px;height:18px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.psec{margin:22px 0 0}.psec>summary{display:flex;align-items:center;gap:10px;padding:14px 2px;border-bottom:1px solid var(--line);list-style:none;cursor:pointer}
.psec>summary::-webkit-details-marker{display:none}.psec>summary b{flex:1;font-size:17px}.psec>summary small{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.psec>summary .pi{width:36px;height:36px;border-radius:11px;background:var(--accd);color:var(--acc);display:grid;place-items:center;flex:none}
.psec>summary>.i:last-child{transition:transform .2s;color:var(--mute)}.psec[open]>summary>.i:last-child{transform:rotate(90deg)}
.psec>.card:first-of-type{margin-top:14px}
/* ---- v19 : rangée compacte de l’accueil ---- */
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:6px}.hrow>button{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;text-align:left;padding:8px;border-radius:14px;cursor:pointer;min-width:0}
.hrow>button+button{border-left:1px solid var(--line);border-radius:0 14px 14px 0}.hrow b{display:block;font-size:14.5px}.hrow small{display:block;font-size:12px;color:var(--mute);font-weight:600;line-height:1.3}.hrow .ring,.hrow svg{flex:none}
/* ---- v23 : finitions (audit) ---- */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1)}
button,.btn,a,[data-act],input,select,label{touch-action:manipulation}
button:not(:disabled),.btn{transition:transform .16s var(--ease-out),background-color .16s,border-color .16s,color .16s}
button:not(:disabled):active,.btn:active{transform:scale(.97)}
.ctr:active{transform:none}.ctr:active .ctrb{transform:scale(.94)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
:focus{scroll-margin-top:80px;scroll-margin-bottom:110px}
.sheet-p:focus{outline:none}
.sheet-out{position:fixed;inset:0;z-index:41;pointer-events:none}
.sheet-out .sheet-p{animation:sheetDown .22s var(--ease-drawer) forwards}.sheet-out .sheet-bg{animation:fadeOut .22s ease-out forwards}
@keyframes sheetDown{to{transform:translateY(105%)}}@keyframes fadeOut{to{opacity:0}}
/* ---- v24 : onglet sport ---- */
.wup{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.wup:first-child{border-top:0}
.wup b{display:block;font-size:15px}.wup small{display:block;font-size:12.5px;color:var(--mute);line-height:1.35;margin-top:2px}
.wup .wn{width:30px;height:30px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-weight:800;flex:none}.wup.ok .wn{background:var(--good);color:#0b0a0d}.wup .btn{flex:none;padding:9px 12px}
.form5{display:flex;gap:6px;margin-top:12px}.form5 span{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:850;font-size:13px;color:#0b0a0d}
.spark{display:flex;align-items:flex-end;gap:5px;height:64px;margin-top:8px}.spark i{flex:1;background:linear-gradient(180deg,var(--vio),rgba(155,124,255,.35));border-radius:5px 5px 2px 2px;min-height:4px}
.wcard{display:flex;gap:12px;align-items:center;width:100%;color:inherit;font:inherit;cursor:pointer}.wcard .bi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.wcard b{display:block;font-size:16px}.wcard small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
/* ---- v25 : nutrition et progrès ---- */
.nrings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.nring{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:inherit;font:inherit;padding:4px 0;cursor:pointer}
.nring span{font-size:13px;font-weight:750;text-align:center;line-height:1.2}.nring small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.mrow{display:flex;gap:10px;align-items:center}.mrow .btn{flex:none}
.mstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}.mstat b{display:block;font-size:22px;font-weight:850}
.mstat small{display:block;font-size:12px;color:var(--mute)}.mstat em{display:block;font-style:normal;font-size:12.5px;font-weight:800;margin-top:2px}
.newpr{font-size:10px;font-weight:850;letter-spacing:.06em;color:#0b0a0d;background:var(--yel);padding:2px 6px;border-radius:6px;vertical-align:2px}
/* ---- v26 : techniques et examen ---- */
.tech{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.tech:first-child{border-top:0}
.tech b{display:block;font-size:15.5px}.tech small{display:block;font-size:12.5px;color:var(--mute);line-height:1.35;margin-top:2px}
.tech .tk{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font:900 18px/1 var(--jp);flex:none}
.tech.ok .tk{background:linear-gradient(180deg,#ffd76a,#e0a91a);color:#0b0a0d}.tech .btn{flex:none}
.exam{border-color:rgba(255,200,61,.45);background:linear-gradient(160deg,rgba(255,200,61,.10),var(--card) 60%)}
.exk{width:52px;height:52px;border-radius:14px;background:var(--yel);color:#0b0a0d;display:grid;place-items:center;font:900 26px/1 var(--jp);flex:none;transform:rotate(-6deg)}
.exbox{width:100%;max-width:340px;margin-top:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:6px 14px;text-align:left}
.exrow{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.exrow:first-child{border-top:0}
.exrow span{flex:1;font-size:13.5px;color:var(--mute);font-weight:700}.exrow b{font-family:var(--disp);font-weight:400;font-size:18px}.exrow em{font-style:normal;font-weight:850;min-width:34px;text-align:right}
/* ---- v16 : animations ---- */
#view.wipe{animation:wipe .26s var(--ease-out) both}
@keyframes wipe{from{clip-path:polygon(0 0,0 0,-35% 100%,0 100%)}to{clip-path:polygon(0 0,135% 0,100% 100%,0 100%)}}
.wipebar{position:fixed;top:-20%;bottom:-20%;left:-30%;width:26%;z-index:55;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,59,48,.9) 40%,#fff 50%,rgba(255,59,48,.9) 60%,transparent);transform:skewX(-24deg);animation:wbar .3s var(--ease-out) forwards}
@keyframes wbar{to{left:130%}}
.flash{position:fixed;inset:0;z-index:79;background:#fff;pointer-events:none;animation:flash .45s ease-out forwards}@keyframes flash{from{opacity:.9}to{opacity:0}}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px)}40%,60%{transform:translate(7px,-3px)}}
.stamp{position:fixed;z-index:78;pointer-events:none;width:58px;height:58px;margin:-29px 0 0 -29px;border:3px solid var(--acc);border-radius:50%;color:var(--acc);display:grid;place-items:center;font:900 26px/1 var(--jp);background:rgba(255,59,48,.12);animation:stamp .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes stamp{0%{transform:scale(2.4) rotate(-30deg);opacity:0}25%{transform:scale(.92) rotate(-12deg);opacity:1}35%{transform:scale(1.04) rotate(-12deg)}75%{opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:0}}
#frest{overflow:hidden}#frest>*{position:relative}
#frest::before{content:"";position:absolute;inset:-60%;background:repeating-linear-gradient(-24deg,transparent 0 16px,rgba(255,59,48,.07) 16px 17px);animation:spd 1.4s linear infinite}
@keyframes spd{to{transform:translate(-6.91px,-15.53px)}}
#focus.final #frest::before{animation-duration:.16s;background:repeating-linear-gradient(-24deg,transparent 0 16px,rgba(255,59,48,.22) 16px 17px)}
#focus.final #frt{color:var(--acc);animation:beat .5s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.12)}}
#timer.final{animation:beat .5s ease-in-out infinite}#timer.final .tt{color:#fff}
.lvup.arcup{perspective:1100px}.lvup.arcup>*{animation:page .75s cubic-bezier(.2,.8,.2,1) both;transform-origin:0 50%}
.lvup.arcup>*:nth-child(2){animation-delay:.12s}.lvup.arcup>*:nth-child(3){animation-delay:.24s}.lvup.arcup>*:nth-child(4){animation-delay:.36s}
@keyframes page{from{transform:rotateY(-85deg);opacity:0}}
/* ---- v13 : consentements, mise à jour ---- */
.cons{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin:10px 0;border:1.5px solid var(--line);border-radius:14px;background:var(--card2);font-size:13.5px;line-height:1.45;cursor:pointer}
.cons input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--acc);-webkit-appearance:checkbox;appearance:auto;padding:0}
.cons a{color:var(--acc);font-weight:700}.cons.need{border-color:var(--acc);animation:pop .35s}
#upd{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 10px);max-width:532px;margin:0 auto;z-index:64;display:flex;align-items:center;gap:12px;background:var(--acc);color:#fff;border-radius:16px;padding:12px 12px 12px 16px;font-weight:750;font-size:14.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
#upd span{flex:1}#upd button{border:0;background:#fff;color:#0b0a0d;font-weight:850;border-radius:11px;padding:9px 14px;cursor:pointer}#upd .x{background:none;color:#fff;padding:6px}
.news li{margin:8px 0}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin:14px 0 6px}.podium div{text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:16px 16px 6px 6px;padding:12px 6px}
.podium b{display:block;font-family:var(--disp);font-weight:400;font-size:26px}.podium span{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.podium small{color:var(--mute);font-size:11px}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

<body>

<nav class="nav" id="nav" aria-label="Navigation principale"></nav>

<script>
// ===================== DONNÉES =====================
const GROUPS=[
{id:'plyo',name:'Pliométrie',exos:[
 {id:'pogo',name:'Pogo jumps (rebonds chevilles)',sets:3,reps:'20',rest:60,wl:null,tips:['Genoux presque tendus, rebondis sur l’avant du pied comme un ressort.','Contact au sol le plus court possible, bras qui accompagnent.','Parfait en échauffement avant une séance ou un match.'],err:['Talons qui touchent le sol','Plier les genoux à chaque rebond']},
 {id:'sj',name:'Squat jump (sans élan)',sets:4,reps:'5',rest:90,wl:null,tips:['Descends en squat à 90°, pause 2 s, puis explose vers le haut sans rebond.','Bras lancés vers le ciel, extension complète chevilles-genoux-hanches.','Réception souple et silencieuse, genoux dans l’axe des pieds.'],err:['Petit rebond avant de sauter','Genoux qui rentrent à la réception']},
 {id:'cmj',name:'Sauts verticaux max (CMJ)',sets:3,reps:'4',rest:75,wl:null,tips:['Descente rapide à mi-hauteur puis saut le plus haut possible, bras lancés.','Vise un repère haut (panneau, mur) à chaque saut.','Repos de 10 s entre chaque saut pour rester explosif.'],err:['Enchaîner sans pause (on fatigue, on saute moins haut)','Réception jambes tendues']},
 {id:'boxj',name:'Box jump',sets:4,reps:'5',rest:90,wl:'cm',tips:['Élan des bras, atterris doucement sur la box en position de squat.','Redescends en marchant, pas en sautant : ça protège tes tendons.','Note la hauteur de la box dans la case cm.'],err:['Box trop haute : on remonte les genoux au lieu de sauter haut','Réception bruyante, jambes tendues']},
 {id:'dropj',name:'Drop jump (réactif)',sets:3,reps:'5',rest:120,wl:'cm',tips:['Laisse-toi tomber d’une box de 30-40 cm (ne saute pas de la box).','Dès le contact, rebondis le plus haut et le plus vite possible.','Niveau avancé : seulement si les box jumps sont maîtrisés. Note la hauteur de chute.'],err:['Contact au sol trop long (on s’écrase)','Box trop haute']},
 {id:'broadj',name:'Saut en longueur sans élan',sets:4,reps:'4',rest:90,wl:'cm',tips:['Balancier des bras, pousse en diagonale vers l’avant.','Réception stable 2 s sans faire de pas. Note ta meilleure distance.'],err:['Réception déséquilibrée','Bras qui ne participent pas']},
 {id:'tuck',name:'Tuck jumps (genoux poitrine)',sets:3,reps:'6',rest:75,wl:null,tips:['Saute haut et ramène les genoux vers la poitrine.','Enchaîne avec un contact court, buste droit.'],err:['Buste qui se penche pour tricher','Réception jambes tendues']},
 {id:'skater',name:'Bonds latéraux (skater)',sets:3,reps:'6 / côté',rest:75,wl:null,tips:['Bond latéral d’une jambe sur l’autre, réception stable 1 s.','Transfert direct sur les déplacements au contre.'],err:['Genou qui rentre à la réception']},
 {id:'slhop',name:'Sauts unipodaux',sets:3,reps:'5 / jambe',rest:90,wl:null,tips:['Sur une jambe, enchaîne 5 petits sauts vers l’avant en contrôlant chaque réception.','Corrige les écarts gauche/droite (jambe d’appel à l’attaque).'],err:['Genou qui part vers l’intérieur','Aller trop vite au détriment du contrôle']},
 {id:'hurdle',name:'Sauts de haies enchaînés',sets:4,reps:'5',rest:90,wl:'cm',tips:['5 haies basses ou plots, saute par-dessus avec un contact au sol très court.','Note la hauteur des haies.'],err:['Pause entre les haies','Réception sur les talons']},
 {id:'approach',name:'Sauts d’attaque avec élan',sets:4,reps:'4',rest:90,wl:null,tips:['Élan en 3-4 pas (droitier : gauche-droite-gauche), dernier pas long et rapide.','Blocage des deux pieds talon-pointe, bras lancés de l’arrière vers le haut.','Vise une cible haute à chaque saut : qualité maximale, pas de fatigue.'],err:['Élan trop lent','Bras en retard sur les jambes']},
 {id:'blockj',name:'Sauts de contre + pas chassés',sets:3,reps:'6',rest:75,wl:null,tips:['Pas chassé latéral puis saut de contre, mains hautes et en avant.','Réception équilibrée sur deux pieds, prêt à repartir.'],err:['Mains qui partent vers l’arrière','Réception sur un pied']},
 {id:'mbthrow',name:'Lancer médecine-ball (geste du smash)',sets:3,reps:'6',rest:75,wl:'kg',tips:['Ballon de 3-5 kg armé derrière la tête, lance fort vers le sol ou un mur.','Enchaîne hanches → buste → bras : c’est la chaîne du smash.'],err:['Lancer uniquement avec les bras','Dos très cambré']},
 {id:'mbslam',name:'Med-ball slam',sets:3,reps:'8',rest:60,wl:'kg',tips:['Monte sur la pointe des pieds, ballon au-dessus de la tête, frappe le sol de toutes tes forces.','Abdos serrés, expire fort.'],err:['Dos arrondi en ramassant le ballon']}]},
{id:'prev',name:'Prévention',exos:[
 {id:'spanish',name:'Squat espagnol isométrique (genoux)',sets:5,reps:'45 s',rest:60,wl:null,tips:['Sangle ou élastique derrière les genoux, attaché à un poteau : descends à ~60-70° et tiens.','Calme la douleur du tendon rotulien (genou du sauteur).','À faire aussi après le volley si les genoux tirent.'],err:['Descendre trop bas','Talons qui décollent']},
 {id:'nordic',name:'Nordic curl (ischios)',sets:3,reps:'5',rest:90,wl:'lest',tips:['À genoux sur un tapis, pieds bloqués : descends le plus lentement possible, hanches et buste alignés.','Rattrape-toi avec les mains, remonte en t’aidant.','Réduit fortement le risque de claquage aux ischios.'],err:['Plier les hanches']},
 {id:'copen',name:'Gainage Copenhague (adducteurs)',sets:3,reps:'20 s / côté',sec:true,rest:45,wl:null,tips:['Gainage latéral, jambe du dessus posée sur un banc (genou sur le banc pour débuter).','Protège l’aine lors des déplacements latéraux.'],err:['Bassin qui tombe']},
 {id:'rotext',name:'Rotation externe d’épaule',sets:3,reps:'15',rest:45,wl:'kg',tips:['Élastique ou poulie, coude collé au corps à 90° : tourne l’avant-bras vers l’extérieur.','Charge légère, mouvement lent : la coiffe des rotateurs travaille.','Indispensable pour l’épaule qui smashe.'],err:['Coude qui décolle','Charge trop lourde']},
 {id:'ytw',name:'Y-T-W (omoplates)',sets:2,reps:'10',rest:45,wl:'lest',tips:['Allongé sur un banc incliné : bras en Y, puis en T, puis en W, pouces vers le haut.','Sans charge ou 1-2 kg, omoplates serrées.'],err:['Hausser les épaules']},
 {id:'calfsl',name:'Mollet unipodal excentrique (Achille)',sets:3,reps:'12 / jambe',rest:45,wl:'lest',tips:['Sur une marche, descente lente 3 s sous le niveau de la marche, remontée rapide.','Renforce le tendon d’Achille, très sollicité au volley.'],err:['Rebondir en bas']}]},
{id:'jambes',name:'Jambes',exos:[
 {id:'squat',name:'Squat barre',sets:4,reps:'6-10',rest:150,tips:['Barre sur les trapèzes, pieds largeur d’épaules, pointes légèrement ouvertes.','Inspire, gaine, descends en gardant les genoux dans l’axe des pieds.','Descends au moins à la parallèle, remonte en poussant le sol.'],err:['Genoux qui rentrent','Talons qui décollent','Dos qui s’arrondit en bas']},
 {id:'trapdl',name:'Soulevé de terre trap bar',sets:4,reps:'4-6',rest:150,tips:['Au centre de la barre hexagonale, dos plat, pousse le sol avec les jambes.','Monte de façon explosive, redescends contrôlé.','Excellent transfert vers la détente.'],err:['Dos arrondi','Hanches qui montent avant les épaules']},
 {id:'sdt',name:'Soulevé de terre roumain',sets:3,reps:'8-10',rest:120,tips:['Dos plat, genoux légèrement fléchis, hanches qui reculent.','La barre reste collée aux jambes.','Descends jusqu’à l’étirement des ischios, remonte en poussant les hanches.'],err:['Dos arrondi','Barre loin des jambes']},
 {id:'hipthrust',name:'Hip thrust',sets:3,reps:'8-10',rest:90,tips:['Haut du dos sur le banc, barre sur les hanches (avec mousse).','Pousse dans les talons, verrouille les fessiers 1 s en haut, menton rentré.'],err:['Cambrer le bas du dos en haut','Pieds trop loin']},
 {id:'presse',name:'Presse à cuisses',sets:3,reps:'10-12',rest:120,tips:['Dos et bassin plaqués au dossier.','Descends à ~90° de genoux, ne verrouille pas en haut.'],err:['Bassin qui décolle','Genoux verrouillés']},
 {id:'fentes',name:'Fentes bulgares',sets:3,reps:'8 / jambe',rest:90,tips:['Pied arrière sur un banc, buste légèrement penché, genou arrière proche du sol.','Genou avant dans l’axe du pied. Haltères dans les mains.'],err:['Pas trop court','Genou avant qui rentre']},
 {id:'lcurl',name:'Leg curl (ischios)',sets:3,reps:'10-15',rest:75,tips:['Hanches plaquées, contrôle la descente (3 s).'],err:['Soulever les hanches']},
 {id:'lext',name:'Leg extension',sets:3,reps:'12-15',rest:60,tips:['Contracte 1 s en haut, descente lente.','Genoux dans l’axe de la machine.'],err:['Balancer la charge']},
 {id:'mollets',name:'Mollets debout',sets:4,reps:'12-15',rest:60,tips:['Amplitude complète : étirement en bas, pause 1 s en haut.','Tempo lent, pas de rebond.'],err:['Rebondir','Demi-amplitude']}]},
{id:'pecs',name:'Pecs',exos:[
 {id:'dc',name:'Développé couché (barre)',sets:4,reps:'6-10',rest:120,tips:['Omoplates serrées et basses, léger arc naturel du dos, fessiers sur le banc.','Pieds ancrés au sol, poignets alignés sur les avant-bras.','Descends la barre au bas des pecs, coudes à ~45-60° du buste.','Pousse en expirant, trajectoire légèrement en arc vers les épaules.'],err:['Fesses qui décollent','Rebond sur la poitrine','Coudes à 90° (stress sur les épaules)']},
 {id:'dih',name:'Développé incliné haltères',sets:3,reps:'8-12',rest:90,tips:['Banc à 30° maximum (au-delà, ça travaille surtout les épaules).','Descends jusqu’à sentir l’étirement des pecs, paumes vers l’avant.','Rapproche les haltères en haut, pecs contractés.'],err:['Banc trop vertical','Amplitude trop courte']},
 {id:'dips',name:'Dips (pecs)',sets:3,reps:'8-12',rest:90,wl:'lest',tips:['Buste penché vers l’avant, coudes légèrement écartés.','Descends jusqu’à avoir les épaules au niveau des coudes, pas plus.','Ajoute du lest dès que tu dépasses 12 reps propres.'],err:['Buste droit (ça cible les triceps)','Descente trop profonde (épaule)']},
 {id:'peck',name:'Écartés poulie / Pec deck',sets:3,reps:'12-15',rest:60,tips:['Coudes légèrement fléchis et fixes, tu « serres un arbre ».','Contrôle l’étirement (2-3 s), pause 1 s contracté.'],err:['Transformer l’écarté en développé','Balancer le buste']}]},
{id:'dos',name:'Dos',exos:[
 {id:'trac',name:'Tractions (ou tirage vertical)',sets:4,reps:'6-10',rest:120,wl:'lest',tips:['Prise un peu plus large que les épaules, épaules basses (loin des oreilles).','Tire les coudes vers les hanches, menton au-dessus de la barre.','Descente contrôlée jusqu’aux bras tendus.','Trop dur ? Tirage vertical, ou tractions avec élastique.'],err:['Élan avec les jambes','Demi-amplitude','Hausser les épaules']},
 {id:'rowb',name:'Rowing barre (buste penché)',sets:4,reps:'8-10',rest:120,tips:['Dos plat, buste à ~45°, genoux légèrement fléchis, abdos gainés.','Tire la barre vers le nombril, coudes près du corps.','Serre les omoplates 1 s en haut, descente contrôlée.'],err:['Dos arrondi','Buste qui se redresse à chaque rep']},
 {id:'rowc',name:'Tirage horizontal poulie',sets:3,reps:'10-12',rest:90,tips:['Poitrine sortie, buste quasi fixe.','Tire vers le bas du ventre, serre les omoplates en fin de mouvement.'],err:['Se balancer d’avant en arrière','Tirer avec les bras uniquement']},
 {id:'rowu',name:'Rowing haltère unilatéral',sets:3,reps:'10-12 / côté',rest:75,tips:['Main et genou sur le banc, dos parallèle au sol.','Tire le coude vers la hanche, pas vers l’épaule.'],err:['Rotation du buste','Tirer avec le biceps']},
 {id:'pullo',name:'Tirage bras tendus (poulie haute)',sets:3,reps:'12-15',rest:60,tips:['Bras quasi tendus, descends la barre vers les cuisses avec les dorsaux.','Léger penché en avant, abdos serrés.'],err:['Plier les coudes (ça devient un triceps)']}]},
{id:'epaules',name:'Épaules',exos:[
 {id:'dm',name:'Développé militaire haltères (assis)',sets:3,reps:'8-10',rest:90,tips:['Dossier à 80-90°, fessiers et dos calés.','Pousse vers le haut, sans verrouiller les coudes.'],err:['Cambrer fortement le bas du dos','Amplitude réduite']},
 {id:'elat',name:'Élévations latérales (haltères)',sets:4,reps:'12-15',rest:60,tips:['Léger penché, coudes légèrement fléchis.','Monte jusqu’à la hauteur des épaules, descente lente (2 s).'],err:['Balancer le corps','Hausser les trapèzes']},
 {id:'oiseau',name:'Oiseau (haltères ou pec deck inversé)',sets:3,reps:'12-15',rest:60,tips:['Buste penché, dos plat, coudes légèrement fléchis.','Écarte en pensant « coudes vers l’extérieur ».'],err:['Tirer avec les trapèzes','Élan']},
 {id:'face',name:'Face pull (poulie, corde)',sets:3,reps:'15',rest:60,tips:['Poulie à hauteur du visage, tire vers le front en écartant la corde.','Coudes hauts, rotation externe en fin de mouvement.','Excellent pour la santé des épaules de volleyeur.'],err:['Charge trop lourde et dos cambré']}]},
{id:'biceps',name:'Biceps',exos:[
 {id:'curlez',name:'Curl barre EZ',sets:3,reps:'8-10',rest:75,tips:['Coudes collés au corps, immobiles.','Descente 2-3 s jusqu’à l’extension quasi complète.'],err:['Élan avec le dos','Coudes qui avancent']},
 {id:'curlinc',name:'Curl incliné haltères',sets:3,reps:'10-12',rest:75,tips:['Banc à 45-60°, bras pendants derrière le buste.','Tourne la paume vers le haut en montant.'],err:['Épaules qui partent en avant']},
 {id:'curlm',name:'Curl marteau',sets:3,reps:'10-12',rest:60,tips:['Prise neutre (pouces vers le haut).','Contrôle la descente.'],err:['Balancer le buste']}]},
{id:'triceps',name:'Triceps',exos:[
 {id:'tpoulie',name:'Extension poulie haute (corde)',sets:3,reps:'10-15',rest:60,tips:['Coudes collés aux côtes, fixes.','Écarte la corde en bas et verrouille complètement.'],err:['Les coudes qui montent']},
 {id:'skull',name:'Barre au front (EZ)',sets:3,reps:'8-12',rest:75,tips:['Seuls les avant-bras bougent, bras quasi verticaux.','Descends vers le front, contrôle.'],err:['Coudes qui s’écartent','Charge trop lourde (douleur de coudes)']},
 {id:'dipst',name:'Dips (triceps)',sets:3,reps:'8-12',rest:90,wl:'lest',tips:['Buste droit, coudes serrés vers l’arrière.','Descends à 90° au coude, remonte en verrouillant.'],err:['Buste penché (ça redevient pecs)']}]},
{id:'abdos',name:'Abdos',exos:[
 {id:'pallof',name:'Pallof press (anti-rotation)',sets:3,reps:'10 / côté',rest:45,tips:['Poulie à hauteur de poitrine, de profil : pousse les mains devant toi sans laisser le buste tourner.','Gainage utile pour la frappe et la réception.'],err:['Buste qui pivote']},
 {id:'crunchp',name:'Crunch poulie haute',sets:3,reps:'12-15',rest:60,tips:['Enroule la colonne en rapprochant les côtes du bassin.','Expire en bas.'],err:['Tirer avec les bras']},
 {id:'rdj',name:'Relevé de jambes suspendu',sets:3,reps:'10-15',rest:60,wl:'lest',tips:['Bascule le bassin vers le haut, pas seulement les jambes.','Contrôle la descente, évite de te balancer.'],err:['Élan','Dos cambré']},
 {id:'planche',name:'Gainage planche',sets:3,reps:'30-60 s',rest:45,wl:'lest',tips:['Corps aligné, fessiers et abdos serrés.','Note la durée en secondes.'],err:['Bassin qui s’affaisse','Fesses trop hautes']},
 {id:'roue',name:'Roulette abdos',sets:3,reps:'8-12',rest:60,wl:null,tips:['Pars des genoux, abdos contractés.','Va aussi loin que tu peux contrôler.'],err:['Creuser le bas du dos']}]}
];
// Exercices ajoutés en v7 (à ajouter dans « Modifier la séance »)
const EXTRA={
 plyo:[{id:'splitj',name:'Fentes sautées',sets:3,reps:'6 / jambe',rest:75,wl:null,tips:['Position de fente, saute et inverse les jambes en l’air.','Réception souple, genou avant dans l’axe du pied.'],err:['Genou avant qui rentre','Buste penché en avant']}],
 prev:[{id:'bandpull',name:'Band pull-apart (élastique)',sets:3,reps:'15-20',rest:45,wl:null,tips:['Bras tendus devant toi, écarte l’élastique jusqu’à la poitrine.','Serre les omoplates, épaules basses.'],err:['Hausser les épaules','Plier les coudes']},

function demo(ex){const A=ANIM[ex.id];if(!A)return '';const ks=A.k,n=ks.length,d=A.d||2.6;
  const kt=Array.from({length:n+1},(_,i)=>+(i/n).toFixed(3)).join(';'),sp=Array(n).fill('.45 0 .55 1').join(';');
  const an=(at,j,i)=>`<animate attributeName="${at}" values="${ks.map(P=>P[j][i]).concat(ks[0][j][i]).join(';')}" keyTimes="${kt}" calcMode="spline" keySplines="${sp}" dur="${d}s" repeatCount="indefinite"/>`;
  const col=g=>SEGM[g].some(m=>ex.mp.includes(m))?'var(--acc)':SEGM[g].some(m=>ex.ms.includes(m))?'#c46a62':'#d6d1dc';
  const ln=(a,b,g,far)=>ks[0][a]&&ks[0][b]?`<line x1="${ks[0][a][0]}" y1="${ks[0][a][1]}" x2="${ks[0][b][0]}" y2="${ks[0][b][1]}" stroke="${col(g)}" stroke-width="${g==='t'?8:g==='ft'?4:6}" stroke-linecap="round"${far?' opacity=".4"':''}>${an('x1',a,0)}${an('y1',a,1)}${an('x2',b,0)}${an('y2',b,1)}</line>`:'';
  const dot=(j,r,fill,extra)=>`<circle cx="${ks[0][j][0]}" cy="${ks[0][j][1]}" r="${r}" fill="${fill}" ${extra||''}>${an('cx',j,0)}${an('cy',j,1)}</circle>`;
  let back='',front='';(A.eq||[]).forEach(q=>{
    if(q[0]==='rect')back+=`<rect x="${q[1]}" y="${q[2]}" width="${q[3]}" height="${q[4]}" rx="2" fill="#2a2630" stroke="#3c3742"/>`;
    else if(q[0]==='line')back+=`<line x1="${q[1]}" y1="${q[2]}" x2="${q[3]}" y2="${q[4]}" stroke="#8f8a96" stroke-width="4" stroke-linecap="round"/>`;
    else if(q[0]==='circle')back+=`<circle cx="${q[1]}" cy="${q[2]}" r="${q[3]}" fill="#3c3742"/>`;
    else if(q[0]==='cable')back+=`<line x1="${q[1]}" y1="${q[2]}" x2="${ks[0][q[3]][0]}" y2="${ks[0][q[3]][1]}" stroke="#5c5763" stroke-width="1.5">${an('x2',q[3],0)}${an('y2',q[3],1)}</line>`;
    else if(q[0]==='plate')back+=dot(q[1],12,'#36313d','stroke="#8f8a96" stroke-width="2"');
    else if(q[0]==='db')front+=dot(q[1],5.5,'#8f8a96');
    else if(q[0]==='ball')front+=dot(q[1],9,'var(--ora)')});
  const body=ln('p','k2','th',1)+ln('k2','a2','sh',1)+ln('a2','f2','ft',1)+back+ln('s','p','t')+ln('p','k','th')+ln('k','a','sh')+ln('a','f','ft')+ln('s','e','ua')+ln('e','w','fa')+dot('h',9,'#d6d1dc');
  return `<div class="demo"><svg viewBox="0 -30 200 184" role="img" aria-label="Démo animée : ${esc(ex.name)}"><line x1="0" y1="150.5" x2="200" y2="150.5" stroke="#3c3742" stroke-width="2"/>${body}${front}</svg>${A.tip?`<div class="small" style="text-align:center;color:#d6d1dc;margin-top:6px">${esc(A.tip)}</div>`:''}</div>`}

const NEWS={'26':['Techniques spéciales : 4 par sport (Frappe éclair, Dunk du ciel, Frappe canon, Raffut…), débloquées par tes rangs, chacune avec son animation. Dans Progrès → Fiche.','Examen de fin d’arc : toutes les 4 semaines d’entraînement, refais tes mesures et découvre ta progression, avec une planche manga à partager.'],'25':['Nutrition en 3 parties : Aujourd’hui (ta journée en 3 anneaux et des idées de repas à noter en un appui), Mon plan, Cuisine (recettes et courses).','Progrès : bilan des 28 derniers jours comparé au mois d’avant, records récents en tête, et l’analyse du corps rangée dans « Tests & corps ».'],'24':['Onglet sport repensé en 3 parties : Aujourd’hui, Matchs, Progresser.','Note ton entraînement en un appui (même durée que la dernière fois, annulable).','Matchs : résultat et score, bilan de ta saison (victoires, défaites, forme sur 5 matchs) et courbe de tes stats.','Jour de match : échauffement guidé avec chrono, conseils de la veille et du lendemain.'],'23':['Finitions : les boutons s’enfoncent sous le doigt, les feuilles glissent à la fermeture et les changements d’écran sont plus vifs.','Accessibilité : l’appli s’utilise mieux avec VoiceOver et au clavier (repère de focus, tous les éléments activables).','Installation plus légère : les photos d’exercices se téléchargent quand tu les ouvres.'],'22':['Ton personnage vit avec toi : il dort si tu ne viens plus, souffle après une séance et fait la fête quand ton objectif de la semaine est tenu.','Passage de rang : une animation quand une stat monte d’un rang, avec de nouveaux gestes quand ton personnage progresse.','Objets à gagner en t’entraînant : bandeau or (niveau 5), brassard de capitaine (6 semaines d’affilée), maillot or (niveau 8).'],'21':['Premier bilan en 2 minutes (accueil ou Progrès → Fiche) : poids, détente, squat, sprint. Ton personnage reçoit son rang tout de suite.','Les nouveaux joueurs créent leur personnage dès l’arrivée dans l’appli.'],'20':['Personnage encore plus détaillé et des animations plus fluides : clignements d’yeux, poussière à l’atterrissage, image fantôme et aura de flammes quand tu maîtrises.','Personnalisation : 6 teints, 8 coupes, 8 couleurs de cheveux, couleur des yeux, couleur du maillot, numéro, bandeau et poignets. Et un bouton « Au hasard ».'],'19':['Appli allégée : le niveau n’a plus de titre (c’est ton rang qui en porte un), l’accueil n’a plus de doublons, un seul bouton de partage, et l’historique montre tes 10 dernières journées.'],'18':['Ton personnage est redessiné : plus détaillé, avec ombres, contour et vraies animations.','Il évolue avec ton rang : au début il rate son smash, perd son dribble ou fait tomber le ballon ; plus tu progresses, plus son geste devient propre, puis explosif.','Les rangs racontent ta progression : Premiers pas, Apprenti, Solide, Redoutable, Prodige, puis Maître de ton sport.'],'17':['Ton personnage en pixel art : il smashe, dribble, jongle ou court selon ton sport, et grandit avec tes stats. Choisis son apparence dans Profil.','Les rangs changent selon ton sport : de Plume à Ciel au volley, de Parquet à Mythe au basket, de Crampon à Légende au foot, de Boue à Légende au rugby.','Écrans allégés : accueil plus simple, Progrès en 4 onglets, Profil rangé en sections.'],'16':['Nouvelle fiche de personnage (Progrès → Fiche) : 5 stats de E à S, un radar et ton archétype, comme « Le petit sauteur » ou « L’éclair ». Tu peux la partager.','Plus d’animations : transitions en cases de manga, impact sur les records, tampon à chaque série validée, chrono qui s’emballe sur les 3 dernières secondes.'],'15':['L’appli s’appelle maintenant Yosha (よっしゃ !). Tes données ne bougent pas. Pour voir la nouvelle icône sur iPhone, supprime puis réinstalle l’appli : fais d’abord une sauvegarde (Profil → Sauvegarder) ou vérifie que ton compte est synchronisé.','Le vert veut dire « validé » ou « équilibré » ; le rouge n’est plus utilisé pour les bonnes nouvelles.','Supprimer ton compte efface maintenant aussi tes réglages de notification, tes messages et tes séances partagées avec le coach.','La page Confidentialité a été corrigée : relis-la avant d’accepter.'],'14':['Le vert veut dire « validé » ou « équilibré » ; le rouge n’est plus utilisé pour les bonnes nouvelles.','Supprimer ton compte efface maintenant aussi tes réglages de notification, tes messages et tes séances partagées avec le coach.','La page Confidentialité a été corrigée : relis-la avant d’accepter.','La mesure vidéo du saut affiche une marge d’erreur réaliste.'],'13':['Les mises à jour s’installent d’un seul bouton : plus besoin de fermer l’appli deux fois.','Ton niveau en salle (débutant, intermédiaire, confirmé) adapte tes séances : Profil → Mon niveau.','Une page claire sur tes données et tes droits : Profil → Confidentialité.']};

function injAlt(id,used){const ex=EX[id],g=GROUPS.find(x=>x.id===ex.g);
  const c=g.exos.filter(e=>e.id!==id&&!used.includes(e.id)&&!risky(e.id)&&!['powerclean','pushpress','sled'].includes(e.id)&&(e.wl===ex.wl||(ex.wl==='kg'&&e.wl==='lest')));
  const sc=e=>-e.mp.filter(m=>ex.mp.includes(m)).length*2-e.ms.filter(m=>ex.mp.includes(m)).length;
  const l=c.sort((a,b)=>sc(a)-sc(b));return l.length&&sc(l[0])<0?l[0].id:null}

async function scanStart(){const msg=$('#scmsg'),v=$('#scv');

  if(!$('#scv')){scanStop();return}v.srcObject=scanStream;try{await v.play()}catch(e){}msg.textContent='Vise le code-barres, bien à plat et éclairé.';
  // 1) Détecteur intégré au navigateur (Android, Chrome) ; 2) sinon bibliothèque ZXing (iPhone)
  try{if('BarcodeDetector' in window){const fm=await BarcodeDetector.getSupportedFormats();if(fm.includes('ean_13')){const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});

  ['.nav .ctr','Le bouton tampon','Il t’emmène à ta séance depuis n’importe quel écran.']],
 workout:[['[data-act=focus]','Le mode plein écran','Un exercice à la fois, de gros boutons + et −, et le chrono de repos qui se lance tout seul.'],
  ['.ex .hd','Un exercice','Touche-le pour noter tes séries, voir la démo, la vidéo et les muscles travaillés.'],
  ['[data-act=edit]','Ta séance, à ta façon','Ajoute, retire ou réordonne les exercices.'],
  ['[data-act=injsheet]','Une douleur ?','Déclare-la : l’appli remplace les exercices qui la sollicitent.']]};
let tourS=null;
function tourMaybe(t){if(!TOURS[t]||LS.get('gym_tour',{})[t]||!profile.onb||!$('#sheet').hidden||focusOn||tourS)return;setTimeout(()=>{if(tab===t&&$('#sheet').hidden&&!focusOn)tourStart(t)},900)}
function tourStart(t){const steps=TOURS[t].filter(s=>document.querySelector(s[0]));if(!steps.length)return;tourS={t,steps,i:0};
  const o=document.createElement('div');o.className='tour';o.id='tour';o.innerHTML='<div class="tour-hole"></div><div class="tour-tip"></div>';document.body.appendChild(o);tourShow()}
function tourShow(){const S=tourS,[sel,ti,tx]=S.steps[S.i],el=document.querySelector(sel),o=$('#tour');if(!el||!o){tourEnd();return}
  el.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(()=>{const r=el.getBoundingClientRect(),h=o.querySelector('.tour-hole'),tip=o.querySelector('.tour-tip'),pad=6;
    Object.assign(h.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
    tip.innerHTML=`<b>${esc(ti)}</b><p>${esc(tx)}</p><div class="row"><small>${S.i+1} / ${S.steps.length}</small><span><button class="sk" data-act="tourend">Passer</button><button class="nx" data-act="tournx">${S.i<S.steps.length-1?'Suivant':'C’est parti'}</button></span></div>`;
    const below=r.bottom+180<innerHeight;tip.style.top=below?(r.bottom+16)+'px':'auto';tip.style.bottom=below?'auto':(innerHeight-r.top+16)+'px'},380)}
function tourEnd(){if(tourS){const d=LS.get('gym_tour',{});d[tourS.t]=1;LS.set('gym_tour',d)}tourS=null;const o=$('#tour');if(o)o.remove()}

// Annuler : la suppression est faite tout de suite, avec 5 secondes pour revenir en arrière
let undoT=null;
function undoBar(msg,fn){clearTimeout(undoT);let b=$('#undo');if(b)b.remove();b=document.createElement('div');b.id='undo';b.setAttribute('role','status');
  b.innerHTML=`<span>${esc(msg)}</span><button>Annuler</button><i></i>`;b.querySelector('button').onclick=()=>{clearTimeout(undoT);b.remove();fn();render();toast('Annulé ✓')};
  document.body.appendChild(b);undoT=setTimeout(()=>b.remove(),5000)}

// Une idée ou un bug : envoyé dans Firebase (collection « feedback »)
function fbSheet(){draft={ft:'idee'};openSheet('Une idée ou un bug ?',`<p class="lead">Dis ce qui te plaît, ce qui bloque ou ce qui manque. Chaque message est lu.</p>
  <div class="field">${optsHtml('ft',[['idee','💡 Idée'],['bug','🐞 Bug'],['autre','💬 Autre']],'idee',3)}</div>
  <label class="field"><span>Ton message</span><textarea id="fbtxt" maxlength="1500" placeholder="Ex. : « Le chrono de repos ne sonne pas quand… »"></textarea></label>
  <button class="btn acc block" data-act="fbsend">${ic('upload')} Envoyer</button>
  <div class="small muted" style="margin-top:10px">${cUser?'Envoyé avec ton prénom, ton sport, l’identifiant de ton compte et le type de téléphone et de navigateur.':'Sans compte, le message s’ouvre dans le partage : envoie-le à la personne qui t’a fait découvrir l’appli.'}</div>`)}
async function fbSend(){const txt=($('#fbtxt').value||'').trim();if(txt.length<3){toast('Écris quelques mots');return}
  const o={type:draft.ft||'idee',txt:txt.slice(0,1500),name:profile.name||'',sport:profile.sport||'volley',v:'v'+APP_V,ua:navigator.userAgent.slice(0,140),at:Date.now()};
  if(cUser&&fbDb){try{await fbDb.collection('feedback').add(Object.assign({uid:cUser.uid},o));closeSheet();toast('Merci ! Message envoyé ✓',2600);return}catch(e){console.warn(e)}}
  const t2=`Yosha · ${o.type} : ${o.txt}`;if(navigator.share)navigator.share({text:t2}).then(()=>{closeSheet();toast('Merci !')}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t2).then(()=>toast('Message copié : colle-le dans un SMS ✓',3000))}

// Bandeau hors ligne
const setOff=()=>document.body.classList.toggle('offline',navigator.onLine===false);
window.addEventListener('offline',setOff);window.addEventListener('online',setOff);setOff();
// Favoris
const isFav=id=>(profile.fav||[]).includes(id);

render();checkGame();tourMaybe(tab);
// Compte : on se reconnecte automatiquement si on l’était, et on envoie avant que l’appli passe en arrière-plan
if(sync.uid)loadFb().catch(()=>{cState='offline'});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&cUser&&sync.dirty){clearTimeout(cT);pushCloud()}});
window.addEventListener('online',()=>{if(cUser&&sync.dirty)pushCloud()});
// ----- v13 : conditions, nouveautés, mise à jour en un bouton -----
// Les personnes déjà inscrites acceptent une fois l’avertissement santé (et la confidentialité si elles ont un compte)
function termsSheet(){const acc=!!(sync.uid||cUser);openSheet('Avant de continuer',`<p class="lead">On a ajouté une page claire sur ta santé, tes données et tes droits.</p>
  ${consentBox('t-ok1',`J’ai lu l’<a href="legal.html#sante" target="_blank">avertissement santé</a> : l’appli ne remplace pas un avis médical, et je m’entraîne sous ma responsabilité.`)}
  ${acc?consentBox('t-ok2',`J’accepte la <a href="legal.html#donnees" target="_blank">politique de confidentialité</a> et la sauvegarde en ligne de mes données, y compris mon poids et mes douleurs déclarées, chez Google Firebase (base en Europe, e-mail et mot de passe traités aux États-Unis).`)+consentBox('t-ok3','J’ai 15 ans ou plus, ou l’accord d’un parent.')+'<div class="small muted">Sans ton accord, l’appli marche sur ce téléphone, mais plus rien n’est envoyé en ligne.</div>':''}
  <button class="btn acc block" data-act="tok" style="margin-top:6px">J’accepte</button>
  ${acc?`<div class="center" style="margin-top:12px"><button class="linkbtn" data-act="cdel" style="color:var(--mute)">Je préfère supprimer mon compte</button></div>`:''}`)}
function whatsNew(){const seen=LS.get('gym_seenv','');if(seen===APP_V)return;LS.set('gym_seenv',APP_V);const l=NEWS[APP_V];if(!profile.onb||!l)return;
  openSheet('<span style="font-family:var(--jp);color:var(--acc);margin-right:8px">新</span>Quoi de neuf',`<p class="lead">Version ${APP_V} de ${APP}.</p><ul class="news">${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="btn acc block" data-act="closesheet" style="margin-top:10px">C’est noté</button>`)}
function updBar(){if($('#upd'))return;const b=document.createElement('div');b.id='upd';b.setAttribute('role','status');
  b.innerHTML='<span>✨ Nouvelle version de Yosha disponible</span><button>Mettre à jour</button><button class="x" aria-label="Plus tard">✕</button>';
  b.querySelector('button').onclick=()=>{try{saveAll()}catch(e){}location.reload()};b.querySelector('.x').onclick=()=>b.remove();document.body.appendChild(b)}
if(!profile.onb){if(sessionDates().length||volley.length){profile.onb=1;saveProfile()}else{LS.set('gym_seenv',APP_V);welcomeSheet()}}
if(profile.onb){if(!profile.terms||profile.terms.v<TERMS_V||(sync.uid&&!hasConsent()))setTimeout(termsSheet,600);else setTimeout(whatsNew,800)}
// Service worker : vérifie les mises à jour au retour dans l’appli, et propose de recharger quand une version est prête
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){const hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg=>{const chk=()=>reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});setInterval(chk,30*60000)}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtrl)updBar()})}
</script>
