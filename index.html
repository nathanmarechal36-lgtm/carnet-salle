<script>

 {id:'mbthrow',name:'Lancer médecine-ball (geste du smash)',sets:3,reps:'6',rest:75,wl:'kg',tips:['Ballon de 3-5 kg armé derrière la tête, lance fort vers le sol ou un mur.','Enchaîne hanches → buste → bras : c’est la chaîne du smash.'],err:['Lancer uniquement avec les bras','Dos très cambré']},

let sCd,sTo,sChk,sH;
function sensStop(){clearInterval(sCd);clearTimeout(sTo);clearTimeout(sChk);if(sH)window.removeEventListener('devicemotion',sH);sH=null}
async function sensGo(){
  const msg=$('#sens-msg'),st=$('#sens-st');
  if(!('DeviceMotionEvent' in window)){msg.textContent='Ce navigateur ne donne pas accès à l’accéléromètre.';return}
  try{if(typeof DeviceMotionEvent.requestPermission==='function'){const p=await DeviceMotionEvent.requestPermission();if(p!=='granted'){msg.textContent='Accès refusé : autorise « Mouvement et orientation » pour ce site.';return}}}catch(e){}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  sensStop();let n=3;st.textContent=n;msg.textContent='Téléphone contre la poitrine…';
  sCd=setInterval(()=>{n--;if(n>0){st.textContent=n;return}clearInterval(sCd);st.textContent='SAUTE !';beep(1);listen()},800);
}
function listen(){
  let state=0,t0=0,got=false;const TH=3.5;
  sH=e=>{const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;got=true;const m=Math.hypot(a.x||0,a.y||0,a.z||0),t=performance.now();
    if(state===0){if(m<TH){state=1;t0=t}}
    else if(m>=TH){const ft=(t-t0)/1000;state=0;if(ft>=.15&&ft<=1.2){sensStop();sensResult(ft)}}};
  window.addEventListener('devicemotion',sH);
  sChk=setTimeout(()=>{if(!got){sensStop();$('#sens-st').textContent='—';$('#sens-msg').textContent='Aucune donnée du capteur sur cet appareil.'}},1500);
  sTo=setTimeout(()=>{sensStop();$('#sens-st').textContent='—';$('#sens-msg').textContent='Aucun saut détecté. Réessaie en sautant franchement.'},7000);
}
function sensResult(ft){const h=Math.round(9.81*ft*ft/8*1000)/10;sens.att.push(h);beep(2);try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  $('#sens-st').textContent=h+' cm';$('#sens-msg').textContent=`Essai ${sens.att.length} · ${Math.round(ft*1000)} ms en l’air`;
  const b=Math.max(...sens.att);$('#sens-att').innerHTML=sens.att.map(x=>`<span class="chip ${x===b?'on':''}">${x} cm</span>`).join('');const sv=$('#sens-save');sv.hidden=false;sv.innerHTML=ic('check')+' Enregistrer '+b+' cm'}

function importTxt(txt){

    if(o.swaps&&typeof o.swaps==='object')swaps=Object.assign({},swaps,o.swaps);
    if(o.profile&&typeof o.profile==='object')profile=Object.assign({},profile,o.profile);
    const merge=(a,b)=>{const ids=new Set(a.map(x=>x.id));b.forEach(x=>{if(x&&x.id&&x.date&&!ids.has(x.id)){a.push(x);n++}});return a};
    if(Array.isArray(o.volley))volley=merge(volley,o.volley);if(Array.isArray(o.jumps))jumps=merge(jumps,o.jumps.filter(j=>JK[j.kind]));
    if(o.rpe&&typeof o.rpe==='object')rpe=Object.assign({},o.rpe,rpe);if(o.match&&!match)match=o.match;
    if(o.prog&&PROGS[o.prog])progId=o.prog,saveProg();
  }
  profile.onb=1;saveAll();return n}

let tInt=null,tEnd=0,actx=null;
function beep(kind){try{if(actx){actx.resume&&actx.resume();(kind===1?[0]:kind===2?[0,.15]:[0,.5]).forEach(dt=>{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=kind?1046:880;g.gain.value=.2;o.start(actx.currentTime+dt);o.stop(actx.currentTime+dt+(kind?.12:.3))})}}catch(e){}if(!kind)try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec,label){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  clearInterval(tInt);tEnd=Date.now()+sec*1000;$('#timer').className='show';$('#tlabel').textContent=label;
  tInt=setInterval(tick,250);tick();keepAwake();
}
function tick(){const r=Math.max(0,Math.ceil((tEnd-Date.now())/1000));$('#tt').textContent=Math.floor(r/60)+':'+pad(r%60);
  if(r<=0){clearInterval(tInt);tInt=null;$('#timer').className='show end';$('#tlabel').textContent='Repos terminé — c’est reparti !';beep();setTimeout(()=>{if($('#timer').classList.contains('end'))$('#timer').className=''},8000)}}
$('#tstop').onclick=()=>{clearInterval(tInt);tInt=null;$('#timer').className=''};
$('#tplus').onclick=()=>{if(!tInt)startTimer(15,'Repos');else{tEnd+=15000;tick()}};
$('#tminus').onclick=()=>{if(tInt){tEnd-=15000;tick()}};
let wl=null,wlOff=null;
async function keepAwake(){clearTimeout(wlOff);wlOff=setTimeout(()=>{try{wl&&wl.release()}catch(e){}wl=null;wlOff=null},20*60000);
  try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(tInt)tick();if(wlOff)keepAwake();if(!typing()&&$('#sheet').hidden)render()}});

function checkSet(id,i){
  const ex=EX[id],e=getEntry(id),s=e.sets[i],pv=prev(id);
  if(s.d){s.d=false;delete s.t;saveLogs();relist();return}
  const sg=sug(e,i,pv);
  if(s.w===null&&sg&&sg.w)s.w=sg.w;if(s.r===null&&sg)s.r=sg.r;
  if(s.w===null&&isOpt(ex)&&s.r!==null)s.w=0;
  if(s.w===null||s.r===null){const inp=document.querySelector(`[data-ex="${id}"][data-i="${i}"][data-f="${s.w===null?'w':'r'}"]`);inp&&inp.focus();toast(s.w===null?'Entre la charge':'Entre le nombre de '+(ex.sec?'secondes':'reps'));return}
  let msg='';
  if(ex.wl==='kg'&&s.w>0){const pb=Math.max(0,...sessionsFor(id).filter(x=>x.date!==date).map(topW));if(pb>0&&s.w>pb&&!e.sets.some((x,j)=>j!==i&&x.d&&x.w>=s.w))msg='Nouveau record : '+s.w+' kg 🎉'}
  s.d=true;s.t=Date.now();saveLogs();
  let nextId=null;
  if(e.sets.every(x=>x.d)&&tab==='workout'){
    openEx.delete(id);const l=curList(),nx=l.find(x=>!exDone(x.id));
    if(nx){openEx.add(nx.id);nextId=nx.id;msg=msg||'Bien joué ! Suivant : '+shortName(nx.id)}else msg=msg||'Séance terminée 💪';
  }
  relist();toast(msg);
  if(nextId)setTimeout(()=>{const el=document.getElementById('ex-'+nextId);el&&el.scrollIntoView({behavior:'smooth',block:'start'})},60);
  else if(tab==='workout'&&!curList().some(x=>!exDone(x.id)))setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),60);
  const restLeft=e.sets.some(x=>!x.d)||nextId;if(restLeft)startTimer(ex.rest,nextId&&nextId!==id?'Repos · ensuite '+shortName(nextId):'Repos · '+shortName(id));
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;const d=t.dataset,a=d.act;
  switch(a){
  case 'go':if(d.ptab)ptab=d.ptab;if(d.jk)jkind=d.jk;if(d.go==='workout'&&tab!=='lib'){date=todayStr();sid=null;showDate=false}go(d.go);break;
  case 'start':date=todayStr();sid=d.sid;showDate=false;autoKey='';openEx.clear();go('workout');break;
  case 'sess':sid=d.v;openEx.clear();autoKey='';render();break;
  case 'showdate':showDate=!showDate;render();break;
  case 'grp':grp=d.v;libQ='';render();break;
  case 'tog':openEx.has(d.id)?openEx.delete(d.id):openEx.add(d.id);relist();break;
  case 'ck':checkSet(d.id,+d.i);break;
  case 'rm':getEntry(d.id).sets.splice(+d.i,1);saveLogs();relist();break;
  case 'addset':getEntry(d.id).sets.push({w:null,r:null,d:false});saveLogs();relist();break;
  case 'rest':startTimer(EX[d.id].rest,'Repos · '+shortName(d.id));break;
  case 'rpe':rpe[date]=+d.v;LS.set('gym_rpe',rpe);toast('Merci, c’est noté');render();break;
  case 'goto':date=d.v;{const e=Object.values(logs).find(x=>x.date===date&&x.sid);if(e){const p=Object.keys(PROGS).find(p=>PROGS[p].sessions.some(s=>s.id===e.sid));if(p)progId=p;sid=e.sid}else sid=null}showDate=date!==todayStr();openEx.clear();autoKey='';go('workout');break;
  case 'ptab':ptab=d.v;render();break;
  case 'jk':jkind=d.v;render();break;
  case 'goal':profile[d.k]=+d.v;saveProfile();render();break;
  case 'setprog':progId=d.v;saveProg();sid=null;render();toast('Programme : '+PROGS[progId].name);break;
  case 'editmatch':{const box=$('#matchedit'),inp=$('#matchd');box.hidden=false;try{inp.showPicker?inp.showPicker():inp.focus()}catch(e){inp.focus()}break}
  case 'clearmatch':match='';LS.set('gym_match',match);render();break;
  case 'delvb':if(confirm('Supprimer cette séance de volley ?')){volley=volley.filter(v=>v.id!==d.id);saveVolley();render()}break;
  case 'deljump':if(confirm('Supprimer ce test ?')){jumps=jumps.filter(j=>j.id!==d.id);saveJumps();render()}break;
  case 'sheet-test':tk=d.tk||(tab==='progress'&&ptab==='detente'?jkind:'cmj');testSheet();break;
  case 'sheet-vb':vbSheet();break;
  case 'sheet-sensor':sensorSheet();break;
  case 'closesheet':closeSheet();break;
  case 'opt':{const g=t.closest('.opts');g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));draft[d.k]=isNaN(+d.v)||d.k==='date'?d.v:+d.v;break}
  case 'wprog':t.parentNode.querySelectorAll('.choice').forEach(b=>b.classList.toggle('on',b===t));draft.prog=d.v;break;
  case 'wdone':profile.name=$('#w-name').value.trim();profile.goalVb=draft.goalVb;profile.goalGym=draft.goalGym;profile.onb=1;saveProfile();progId=draft.prog||progId;saveProg();sid=null;closeSheet();render();toast(profile.name?'Bienvenue '+profile.name+' !':'C’est parti !');break;
  case 'tk':tk=d.v;testSheet();break;
  case 'savetest':{const v=num($('#t-val').value),dt=($('#t-date')&&$('#t-date').value)||todayStr();if(!v||v<=0){toast('Entre ta mesure');$('#t-val').focus();return}
    const prevBest=bestJ(tk);jumps.push({id:uid(),date:dt,kind:tk,val:v,method:'manuel',note:($('#t-note')&&$('#t-note').value.trim())||''});saveJumps();
    closeSheet();toast(prevBest!=null&&v>prevBest?'Nouveau record ! 🚀':'Test enregistré ✓');jkind=tk;render();break}
  case 'savevb':volley.push({id:uid(),date:draft.date||todayStr(),type:draft.type||'entr',min:+draft.min||120,rpe:+draft.rpe||5,note:($('#v-note')&&$('#v-note').value.trim())||''});saveVolley();closeSheet();toast('Séance de volley notée ✓');render();break;
  case 'sensgo':sensGo();break;
  case 'senssave':if(sens.att.length){const b=Math.max(...sens.att),pb=bestJ('cmj');jumps.push({id:uid(),date:todayStr(),kind:'cmj',val:b,method:'capteur'});saveJumps();closeSheet();toast(pb!=null&&b>pb?'Nouveau record : '+b+' cm 🚀':'Détente enregistrée : '+b+' cm');jkind='cmj';render()}break;
  case 'dl':download();break;
  case 'file':$('#bkfile').click();break;
  case 'copy':{const txt=exportTxt(),m=$('#bkmsg'),ta=$('#bk');ta.value=txt;
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{markBk();m.textContent='Copié ! Colle-le dans une note pour le garder.'}).catch(()=>{ta.select();m.textContent='Sélectionne et copie le texte ci-dessus.'});break}
  case 'paste':{const m=$('#bkmsg');try{const n=importTxt($('#bk').value);render();toast(n+' élément(s) importé(s)')}catch(e){m.textContent='Sauvegarde invalide.'}break}
  case 'install':if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()})}break;
  case 'hideinstall':LS.set('gym_hideinstall',true);render();break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target,d=t.dataset||{};
  if(d.f){getEntry(d.ex).sets[+d.i][d.f]=num(t.value);saveLogs()}
  else if(d.note){getEntry(d.note).note=t.value;saveLogs()}
  else if(d.pf){const v=t.value;profile[d.pf]=['taille','poids','reach','net'].includes(d.pf)?(num(v)??''):v;saveProfile()}
  else if(t.id==='libq'){libQ=t.value;$('#libl').innerHTML=libList();document.querySelectorAll('.chip[data-act=grp]').forEach(c=>c.classList.toggle('on',!libQ&&c.dataset.v===grp))}
  else if(t.id==='t-rj'){const r=reach(),v=num(t.value);if(r&&v)$('#t-val').value=Math.round((v-r)*10)/10}
  else if(t.id==='t-val'&&$('#t-calc')){const v=num(t.value),r=reach();$('#t-calc').textContent=v?`${r?'Détente : '+Math.round(v-r)+' cm · ':''}${sgn(Math.round(v-net()))} cm au-dessus du filet`:''}
});
document.addEventListener('change',ev=>{
  const t=ev.target,d=t.dataset||{};
  if(t.id==='dt'&&t.value){date=t.value;sid=null;openEx.clear();autoKey='';render()}
  else if(t.id==='pex'){pex=t.value;render()}
  else if(t.id==='matchd'){match=t.value;LS.set('gym_match',match);render()}
  else if(d.pf){if(d.pf==='poste'||d.pf==='net'||d.pf==='name')render()}
  else if(d.swap){const o=d.swap,v=t.value,cur=(swaps[sid]||{})[o]||o;swaps[sid]=swaps[sid]||{};if(v===o)delete swaps[sid][o];else swaps[sid][o]=v;LS.set('gym_swaps',swaps);openEx.delete(cur);openEx.add(v);render()}
  else if(t.id==='bkfile'&&t.files&&t.files[0]){const f=t.files[0];f.text().then(txt=>{const n=importTxt(txt);render();toast(n+' élément(s) restauré(s)')}).catch(()=>toast('Fichier invalide'));t.value=''}
  else if(d.f&&tab!=='lib')render();
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if((tab==='home'||tab==='profile')&&!typing()&&$('#sheet').hidden)render()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;LS.set('gym_hideinstall',true);if(!typing())render()});

render();
if(!profile.onb){if(sessionDates().length||volley.length){profile.onb=1;saveProfile()}else welcomeSheet()}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
